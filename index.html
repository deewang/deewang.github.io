<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daniel Wang — Pokedex Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  /* ============================================================ foundation */
  :root {
    --fd: 'Chakra Petch', 'Segoe UI', sans-serif;
    --fb: 'IBM Plex Sans', system-ui, sans-serif;
    --fm: 'IBM Plex Mono', ui-monospace, monospace;

    /* Matte injection-moulded ABS. Low contrast on purpose: the reference is
       a soft-lit studio render, not polished plastic. */
    --red-lit:  #e9604a;
    --red:      #d8452f;
    --red-mid:  #c2371f;
    --red-deep: #a02a16;
    --red-edge: #7b1d0d;

    --bezel:      #e9eae4;
    --bezel-mid:  #d2d4cb;
    --bezel-deep: #a8aba1;

    --lcd:      #2c3022;
    --lcd-deep: #1e2117;
    --lcd-lit:  #39461f;

    --keyface: #8ecfdc;
    --amber:   #f0c246;
    --ink:     #10151a;
  }

  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #17181a; overflow: hidden; font-family: var(--fb);
  }

  /* ============================================================ layer stack
     #uiLayer   z1  — the device, hidden until the flash hands over
     #landing   z10 — pixel intro, removed once it has handed over
     #fullFlash z20 — the white burst that covers the swap
     #replay    z30 — always reachable
     ====================================================================== */
  #uiLayer {
    position: fixed; inset: 0; z-index: 1;
    background: radial-gradient(130% 100% at 50% 8%, #3a3d42 0%, #26282c 45%, #151619 100%);
    opacity: 0; visibility: hidden; overflow: hidden;
  }
  #uiLayer.on { opacity: 1; visibility: visible; }

  #landing {
    position: fixed; inset: 0; z-index: 10; background: #0b0b0d;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  #landing.gone { display: none; }

  #titleWrap { text-align: center; margin-bottom: -108px; position: relative; top: -58px; z-index: 4; }
  #titleCanvas { display: block; margin: 0 auto; image-rendering: pixelated; }
  #hintCanvas {
    display: block; margin: 26px auto 0; image-rendering: pixelated;
    animation: hintPulse 2.4s ease-in-out infinite;
  }
  @keyframes hintPulse { 0%, 100% { opacity: 0.12; } 50% { opacity: 1; } }

  #rigWrap { position: relative; width: 432px; height: 567px; cursor: pointer; perspective: 1700px; }
  #rig { position: relative; width: 432px; height: 567px; transform-style: preserve-3d; }
  canvas.face { position: absolute; top: 0; left: 0; image-rendering: pixelated; }
  #base, #backPlate, #lidOuter, #lidInner { backface-visibility: hidden; }
  #backPlate { transform: rotateY(180deg); }
  #lidHinge {
    position: absolute; top: 0; left: 0; width: 432px; height: 567px;
    transform-origin: 91.667% 50%; transform-style: preserve-3d;
  }
  #lidInner { transform: rotateY(180deg); visibility: hidden; }

  #fullFlash {
    position: fixed; top: 0; left: 0; image-rendering: pixelated;
    z-index: 20; pointer-events: none; opacity: 0;
  }

  #replay {
    position: fixed; bottom: 24px; right: 24px; z-index: 30;
    background: rgba(255,255,255,0.05); border: 1px solid #3d3f45; color: #8f939b;
    font-family: var(--fm); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase;
    padding: 9px 18px; border-radius: 7px; cursor: pointer;
    opacity: 0; pointer-events: none; transition: opacity 300ms ease, color 160ms, border-color 160ms;
  }
  #replay.visible { opacity: 1; pointer-events: auto; }
  #replay:hover { color: #fff; border-color: #70747c; background: rgba(255,255,255,0.10); }

  /* ================================================================ device
     Authored at a fixed design size and scaled to fit, so every proportion
     holds at any viewport. Layout is flex all the way down — no grid-column
     overrides that quietly reflow when a child changes size.
     ====================================================================== */
  #stage {
    position: absolute; left: 50%; top: 0;
    width: 1240px; height: 900px;
    transform-origin: 50% 0; will-change: transform;
  }
  .dex { position: absolute; inset: 0; display: flex; align-items: flex-start; }

  /* ------------------------------------------------------------- the shells */
  .shell {
    position: relative;
    background:
      linear-gradient(176deg,
        var(--red-lit) 0%, var(--red) 16%, var(--red) 52%,
        var(--red-mid) 78%, var(--red-deep) 94%, var(--red-edge) 100%);
    filter: drop-shadow(0 26px 34px rgba(0,0,0,0.55));
  }
  /* broad, soft ambient falloff — matte, not glossy */
  .shell::before {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background:
      radial-gradient(120% 70% at 26% 4%, rgba(255,255,255,0.20), rgba(255,255,255,0) 62%),
      linear-gradient(100deg, rgba(0,0,0,0) 62%, rgba(0,0,0,0.16) 100%);
  }
  .shell > * { position: relative; z-index: 1; }

  .shell.left {
    width: 570px; height: 900px;
    border-radius: 30px 12px 14px 30px;
  }
  .shell.right {
    width: 570px; height: 812px; margin-top: 88px;
    border-radius: 12px 26px 26px 12px;
    /* the stepped shoulder rising from the hinge, as in the reference */
    clip-path: polygon(0 13%, 20% 13%, 33% 0, 100% 0, 100% 100%, 0 100%);
  }

  /* the raised lip across the top of the left shell */
  .lip {
    height: 168px;
    background: linear-gradient(178deg, #ef6b53 0%, #de4c35 62%, #bf3520 100%);
    clip-path: polygon(0 0, 100% 0, 100% 58%, 72% 58%, 56% 100%, 0 100%);
    display: flex; align-items: center; gap: 30px;
    padding: 0 34px;
  }
  .lens {
    width: 112px; height: 112px; border-radius: 50%; flex: none;
    background:
      radial-gradient(circle at 36% 30%, #f2ffff 0%, #9fe9f7 20%, #4fc9ea 48%, #1f8fc0 78%, #10557d 100%);
    box-shadow:
      0 0 0 8px #e3e5df, 0 0 0 10px rgba(0,0,0,0.28),
      inset 0 -10px 20px rgba(0,0,0,0.35),
      0 0 26px 6px rgba(90, 215, 245, 0.35);
    position: relative;
  }
  .lens::after {
    content: ""; position: absolute; left: 22%; top: 14%; width: 32%; height: 24%;
    border-radius: 50%; filter: blur(2px);
    background: linear-gradient(160deg, rgba(255,255,255,0.95), rgba(255,255,255,0));
  }
  .leds { display: flex; gap: 20px; margin-bottom: 34px; }
  .led {
    width: 30px; height: 30px; border-radius: 50%;
    background: radial-gradient(circle at 36% 30%, var(--l) 0%, var(--d) 72%);
    box-shadow: inset 0 -3px 5px rgba(0,0,0,0.5), 0 1px 0 rgba(255,255,255,0.18);
  }

  /* ----------------------------------------------------------- screen frame */
  .frame {
    margin: 26px 34px 0;
    height: 372px;
    background: linear-gradient(174deg, #f6f7f3 0%, var(--bezel) 26%, var(--bezel-mid) 82%, var(--bezel-deep) 100%);
    clip-path: polygon(0 0, 100% 0, 100% 100%, 62px 100%, 0 calc(100% - 62px));
    padding: 18px 22px 0;
    display: flex; flex-direction: column;
  }
  .lamps { display: flex; gap: 30px; justify-content: center; margin-bottom: 12px; }
  .lamp {
    width: 13px; height: 13px; border-radius: 50%;
    background: radial-gradient(circle at 36% 30%, #8c1f14, #521008 75%);
    box-shadow: inset 0 -1px 2px rgba(0,0,0,0.6);
  }
  .glass {
    flex: 1; min-height: 0; border-radius: 4px; position: relative; overflow: hidden;
    background: linear-gradient(172deg, #3b4030 0%, var(--lcd) 40%, var(--lcd-deep) 100%);
    box-shadow: inset 0 0 0 3px #6d7166, inset 0 6px 16px rgba(0,0,0,0.55);
    transition: background 220ms ease;
  }
  .glass.lit { background: linear-gradient(172deg, #4c5c26 0%, var(--lcd-lit) 42%, #242c12 100%); }
  .glass::after {
    content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 3;
    background: linear-gradient(128deg, rgba(255,255,255,0.08) 0%, rgba(255,255,255,0) 46%);
  }
  .foot { height: 54px; display: flex; align-items: center; }
  .foot .dot {
    width: 15px; height: 15px; border-radius: 50%;
    background: radial-gradient(circle at 36% 30%, #c4341f, #6e1607 78%);
    box-shadow: inset 0 -1px 2px rgba(0,0,0,0.5);
  }
  .foot .grille { margin-left: auto; display: grid; gap: 4px; }
  .foot .grille i {
    display: block; width: 62px; height: 3px;
    background: var(--bezel-deep); box-shadow: 0 1px 0 rgba(255,255,255,0.75);
  }

  /* ---------------------------------------------------------- left controls */
  .controls { padding: 26px 34px 0; display: flex; flex-direction: column; gap: 22px; }
  .row { display: flex; align-items: center; gap: 20px; }
  .row.lower { align-items: flex-start; gap: 26px; }
  .dots { display: flex; gap: 9px; margin-left: 6px; }
  .dots i {
    width: 9px; height: 9px; border-radius: 50%; display: block;
    background: #9a2b18; box-shadow: inset 0 -1px 1px rgba(0,0,0,0.5);
  }

  /* ------------------------------------------------------------ right shell */
  .rpad { padding: 130px 34px 0; display: flex; flex-direction: column; gap: 22px; }
  .sidescreen {
    height: 136px; border-radius: 4px;
    background: linear-gradient(172deg, #2e3226 0%, #1b1e16 48%, #121409 100%);
    box-shadow: inset 0 0 0 3px #5d6157, inset 0 6px 16px rgba(0,0,0,0.6);
    padding: 0 24px;
    display: flex; flex-direction: column; justify-content: center; gap: 7px; overflow: hidden;
  }
  .keypad { display: grid; grid-template-columns: repeat(5, 1fr); gap: 7px; }
  .strip { display: flex; align-items: center; gap: 14px; }
  .strip .minidots { display: flex; gap: 10px; }
  .strip .minidots i {
    width: 10px; height: 10px; border-radius: 50%; display: block;
    background: #2a2a2a; box-shadow: inset 0 -1px 1px rgba(0,0,0,0.6), 0 1px 0 rgba(255,255,255,0.14);
  }
  .strip .bar {
    width: 74px; height: 13px; border-radius: 3px; margin-left: auto;
    background: linear-gradient(180deg, #33343a, #1a1b1f);
    box-shadow: inset 0 1px 2px rgba(0,0,0,0.7), 0 1px 0 rgba(255,255,255,0.16);
  }
  .strip .bar + .bar { margin-left: 0; }
  .lowrow { display: flex; align-items: center; gap: 0; }
  .tiles { display: flex; gap: 28px; }
  .slot {
    flex: 1; height: 92px; border-radius: 3px;
    background: linear-gradient(180deg, #1d1d1f 0%, #0e0e10 100%);
    box-shadow: inset 0 2px 5px rgba(0,0,0,0.8), 0 1px 0 rgba(255,255,255,0.14);
    text-decoration: none;
    display: flex; flex-direction: column; justify-content: center; gap: 6px; padding: 0 18px;
    transition: filter 160ms ease, transform 90ms ease;
  }
  .slot:hover { filter: brightness(1.5); }
  .slot:active { transform: translateY(2px); }
  .slot .tag {
    font-family: var(--fm); font-size: 10px; letter-spacing: 0.18em;
    color: #7d8f6e; text-transform: uppercase;
  }
  .slot .name { font-family: var(--fd); font-weight: 600; font-size: 17px; color: #d9e6cd; }

  /* ---------------------------------------------------------------- hinge */
  .hinge {
    width: 100px; height: 900px; position: relative; flex: none;
    background: linear-gradient(90deg,
      #7d1d0c 0%, #a92a15 12%, #cd3a22 30%, #ef6a52 48%,
      #d94128 64%, #a42a15 84%, #6f1808 100%);
    border-radius: 8px;
    filter: drop-shadow(0 26px 30px rgba(0,0,0,0.5));
  }
  .hinge i {
    position: absolute; left: 0; right: 0; height: 22px;
    background: linear-gradient(180deg, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0.12) 60%, rgba(255,255,255,0.10) 100%);
  }
  .hinge i:nth-child(1) { top: 86px; }
  .hinge i:nth-child(2) { top: 132px; }
  .hinge i:nth-child(3) { bottom: 132px; }
  .hinge i:nth-child(4) { bottom: 86px; }
</style>
</head>
<body>

<div id="uiLayer">
  <div id="stage">
    <div class="dex">

      <!-- ============================================ left shell: the screen -->
      <div class="shell left">
        <div class="lip">
          <div class="lens"></div>
          <div class="leds">
            <span class="led" style="--l:#a495ad; --d:#4e4455"></span>
            <span class="led" style="--l:#cfbb4a; --d:#6a5c14"></span>
            <span class="led" style="--l:#4f8a5c; --d:#1f3f27"></span>
          </div>
        </div>

        <div class="frame">
          <div class="lamps"><span class="lamp"></span><span class="lamp"></span></div>
          <div class="glass"><section id="screenMain" tabindex="0" aria-label="Dex entry"></section></div>
          <div class="foot">
            <span class="dot"></span>
            <span class="grille"><i></i><i></i><i></i><i></i><i></i></span>
          </div>
        </div>

        <div class="controls">
          <div class="row">
            <button class="btn round black" data-act="light" title="Backlight"
                    aria-label="Toggle backlight"></button>
            <button class="btn pill red"  data-act="open" aria-label="Open selected key"></button>
            <button class="btn pill blue" data-act="home" aria-label="Back to index"></button>
          </div>
          <div class="row lower">
            <button class="btn greenpad" data-act="next" aria-label="Next section"></button>
            <div class="dpad">
              <div class="dpad-plate">
                <span class="ar u">▲</span><span class="ar d">▼</span>
                <span class="ar l">◀</span><span class="ar r">▶</span>
                <span class="hub"></span>
              </div>
              <button class="dz u" data-dir="up"    aria-label="Cursor up"></button>
              <button class="dz d" data-dir="down"  aria-label="Cursor down"></button>
              <button class="dz l" data-dir="left"  aria-label="Cursor left"></button>
              <button class="dz r" data-dir="right" aria-label="Cursor right"></button>
            </div>
          </div>
          <div class="dots"><i></i><i></i><i></i><i></i></div>
        </div>
      </div>

      <div class="hinge"><i></i><i></i><i></i><i></i></div>

      <!-- ========================================= right shell: the controls -->
      <div class="shell right">
        <div class="rpad">
          <aside class="sidescreen" id="screenSide" aria-hidden="true"></aside>
          <nav class="keypad" id="keypad" aria-label="Sections"></nav>
          <div class="strip">
            <span class="minidots"><i></i><i></i></span>
            <span class="bar"></span><span class="bar"></span>
          </div>
          <div class="lowrow">
            <button class="btn white l" data-act="pageup"   aria-label="Page up">▲</button>
            <button class="btn white r" data-act="pagedown" aria-label="Page down">▼</button>
            <button class="btn sphere" data-act="contact" title="Contact"
                    aria-label="Jump to contact" style="margin-left:auto"></button>
          </div>
          <div class="tiles" id="tiles"></div>
        </div>
      </div>

    </div>
  </div>
</div>

<div id="landing">
  <div id="titleWrap">
    <canvas id="titleCanvas"></canvas>
    <canvas id="hintCanvas"></canvas>
  </div>
  <div id="rigWrap">
    <div id="rig">
      <canvas id="backPlate" class="face" width="432" height="567"></canvas>
      <canvas id="base" class="face" width="432" height="567"></canvas>
      <div id="lidHinge">
        <canvas id="lidOuter" class="face" width="432" height="567"></canvas>
        <canvas id="lidInner" class="face" width="432" height="567"></canvas>
      </div>
    </div>
  </div>
</div>

<canvas id="fullFlash"></canvas>
<button id="replay">Replay</button>

<footer id="hatch">
  <b>Daniel Wang</b><span class="sep">/</span>Computer Engineering, UBC 2028<br>
  <a href="./Daniel_Wang_Resume.pdf">Resume</a><span class="sep">·</span><a
     href="https://github.com/deewang">GitHub</a><span class="sep">·</span><a
     href="https://linkedin.com/in/daniel-wang77">LinkedIn</a><span class="sep">·</span><a
     href="mailto:daniel.yuewang@gmail.com">daniel.yuewang@gmail.com</a>
</footer>

<script>
// Bridge between the two scenes. The landing calls enterUI() the moment the
// white burst covers the frame; the replay button calls resetUI(). Both are
// installed by SCENE 2, which must therefore run BEFORE the landing script.
window.PORTFOLIO = {};
</script>

<!-- =====================================================================
     SCENE 2 — the device: materials, controls, navigation
     Runs BEFORE the landing script, because the landing calls
     PORTFOLIO.resetUI() on load and needs it to already exist.
     ===================================================================== -->
<style>
  /* ================================================================ buttons
     Matte mouldings, not polished plastic: shallow gradients, one soft top
     highlight, a solid side wall. Pressing drops the cap by the wall height
     and squashes it into its own base.
     ====================================================================== */
  .btn {
    position: relative;
    appearance: none; margin: 0; border: 0; padding: 0; cursor: pointer;
    font-family: var(--fd); font-weight: 600; line-height: 1;
    color: var(--label, #fff);
    display: inline-flex; align-items: center; justify-content: center;
    transform-origin: 50% 100%;
    background: linear-gradient(179deg, var(--hi) 0%, var(--face) 34%, var(--lo) 100%);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.34),
      inset 0 -3px 4px rgba(0,0,0,0.22),
      0 var(--lift, 6px) 0 var(--side),
      0 calc(var(--lift, 6px) + 5px) 9px rgba(0,0,0,0.42);
    transition: transform 80ms cubic-bezier(.2,.8,.3,1),
                box-shadow 80ms ease, background 160ms ease, filter 160ms ease;
    will-change: transform;
  }
  .btn:hover { filter: brightness(1.07); }
  .btn:active, .btn.press {
    transform: translateY(var(--lift, 6px)) scaleY(0.93);
    background: linear-gradient(179deg, var(--lo) 0%, var(--face) 82%);
    box-shadow: inset 0 3px 7px rgba(0,0,0,0.5), 0 0 0 var(--side);
    filter: brightness(0.92);
  }
  .btn:focus-visible { outline: 3px solid var(--amber); outline-offset: 4px; }

  @keyframes fireFlare {
    0%   { filter: brightness(1.7) saturate(1.25); }
    100% { filter: brightness(1) saturate(1); }
  }
  .btn.fired { animation: fireFlare 320ms ease-out; }

  /* -------------------------------------------------------------- variants */
  .btn.round.black {
    width: 62px; height: 62px; border-radius: 50%; --lift: 5px;
    --face:#2b2b30; --hi:#4e4e57; --lo:#151519; --side:#0a0a0d;
  }
  .btn.pill {
    width: 96px; height: 22px; border-radius: 999px; --lift: 4px;
  }
  .btn.pill.red  { --face:#b5372a; --hi:#d96150; --lo:#7d2015; --side:#4f1109; }
  .btn.pill.blue { --face:#6ec4d8; --hi:#a5e2ef; --lo:#3d8b9e; --side:#26606f; }

  .btn.white {
    width: 84px; height: 56px; font-size: 17px; --lift: 5px;
    --face:#e4e6e0; --hi:#fbfcf9; --lo:#adb1a8; --side:#7d8177; --label:#33372f;
  }
  .btn.white.l { border-radius: 5px 0 0 5px; }
  .btn.white.r { border-radius: 0 5px 5px 0; }

  /* The one glossy part on the whole device, exactly as in the reference. */
  .btn.sphere {
    width: 74px; height: 74px; border-radius: 50%; --lift: 4px;
    background: radial-gradient(circle at 34% 27%,
      #fff6d2 0%, #f6cf5c 24%, var(--amber) 48%, #c1881d 78%, #7c520a 100%);
    box-shadow:
      inset 0 -6px 12px rgba(0,0,0,0.35),
      0 4px 0 #6d470a, 0 10px 14px rgba(0,0,0,0.45);
  }
  .btn.sphere::after {
    content: ""; position: absolute; left: 20%; top: 12%; width: 30%; height: 24%;
    border-radius: 50%; filter: blur(1px);
    background: linear-gradient(160deg, rgba(255,255,255,0.95), rgba(255,255,255,0));
  }
  .btn.sphere:active, .btn.sphere.press { transform: translateY(4px) scale(0.98); }

  .btn.greenpad {
    width: 258px; height: 116px; border-radius: 4px; --lift: 5px;
    --face:#45532a; --hi:#61733d; --lo:#2c3619; --side:#1b220f; --label:#cfe0ac;
    display: flex; gap: 10px; align-items: baseline; justify-content: center;
  }
  .greenpad .idx { font-size: 44px; font-weight: 700; }
  .greenpad .of  { font-size: 18px; opacity: 0.66; }

  /* ------------------------------------------------------------------ keys */
  .key {
    height: 62px; border-radius: 4px; font-size: 14px; letter-spacing: 0.04em;
    --face:#8ecfdc; --hi:#bcebf3; --lo:#5e9fb0; --side:#3d7382; --label:#123d48;
    --lift: 6px;
  }
  .key.link { --face:#7fd0b6; --hi:#b3ebd9; --lo:#4d9d85; --side:#316c5b; --label:#0d3d31; }
  .key.on   { --face:#f0c246; --hi:#ffe79c; --lo:#ab8318; --side:#75590c; --label:#332604; }
  .key::before {
    content: ""; position: absolute; inset: -4px; border-radius: 7px;
    border: 2px solid transparent; pointer-events: none;
    transition: border-color 160ms ease;
  }
  .key.on::before { border-color: #ffeaa8; animation: ring 1.5s ease-in-out infinite; }
  @keyframes ring { 0%, 100% { opacity: 0.28; } 50% { opacity: 1; } }

  /* ============================================================== the D-pad
     One moulded cross on a pivot. Pressing an arm tips the whole plate toward
     it — the four hit zones are invisible and only pick the direction.
     ====================================================================== */
  .dpad { position: relative; width: 186px; height: 186px; perspective: 460px; flex: none; }
  .dpad-plate {
    position: absolute; inset: 0;
    transition: transform 120ms cubic-bezier(.25,.85,.35,1);
    clip-path: polygon(33% 0, 67% 0, 67% 33%, 100% 33%, 100% 67%,
                       67% 67%, 67% 100%, 33% 100%, 33% 67%, 0 67%, 0 33%, 33% 33%);
    background: linear-gradient(176deg, #4c4c55 0%, #37373f 40%, #26262c 100%);
    box-shadow: inset 0 2px 0 rgba(255,255,255,0.16), inset 0 -5px 9px rgba(0,0,0,0.5);
    filter: drop-shadow(0 7px 0 #141418) drop-shadow(0 12px 12px rgba(0,0,0,0.5));
  }
  .dpad-plate.up    { transform: rotateX(14deg)  translateY(2px); }
  .dpad-plate.down  { transform: rotateX(-14deg) translateY(-2px); }
  .dpad-plate.left  { transform: rotateY(-14deg) translateX(2px); }

const pad3 = n => String(n).padStart(3, '0');
const pad2 = n => String(n).padStart(2, '0');
const $ = s => document.querySelector(s);

const uiLayer = $('#uiLayer');
const stage   = $('#stage');
const main    = $('#screenMain');
const side    = $('#screenSide');
const glass   = main.parentElement;
const keypad  = $('#keypad');
const tileBox = $('#tiles');
const plate   = $('.dpad-plate');
const greenEl = $('.btn.greenpad');

let active = 'HOME';
let cur = { r: 0, c: 0 };
const at = () => GRID[cur.r][cur.c];

// ------------------------------------------------------------------ render

  const s = SECTIONS[active];

  if (s.sublead) h += '<p class="sublead">' + esc(s.sublead) + '</p>';
  if (s.rows) {
    h += '<dl class="rows">';
    // Row values may carry anchors on purpose, so they are not escaped.
    s.rows.forEach(r => { h += '<div><dt>' + esc(r[0]) + '</dt><dd>' + r[1] + '</dd></div>'; });

function cursorTo(label) {

  paint();
}

function moveCursor(dr, dc) {
  cur.r = (cur.r + dr + GRID.length) % GRID.length;
  cur.c = (cur.c + dc + GRID[0].length) % GRID[0].length;
  if (SECTIONS[at()]) active = at();
  paint();
}

// Red / Enter acts on whatever the cursor sits on. A link opens only on an
// explicit press, never because the cursor drifted across it.
function activate() {
  const label = at();
  fire(keypad.querySelector('[data-label="' + label + '"]'));
  if (LINKS[label]) window.open(LINKS[label], /^https?:/.test(LINKS[label]) ? '_blank' : '_self');
  else { active = label; paint(); }
}

const scrollPage = f => main.scrollBy({ top: main.clientHeight * f, behavior: 'smooth' });
const toggleLit  = () => glass.classList.toggle('lit');

function fire(el) {
  if (!el) return;
  el.classList.remove('fired');
  void el.offsetWidth;
  el.classList.add('fired');
  setTimeout(() => el.classList.remove('fired'), 340);

function press(el) {
  if (!el) return;
  el.classList.add('press');
  setTimeout(() => el.classList.remove('press'), 150);
}

// The cross is one piece: tipping it is a class on the plate, not four caps.
let tipTimer = null;
function tip(dir) {
  clearTimeout(tipTimer);
  plate.classList.remove('up', 'down', 'left', 'right');
  void plate.offsetWidth;
  plate.classList.add(dir);
  tipTimer = setTimeout(() => plate.classList.remove(dir), 180);
}

  up:    () => moveCursor(-1, 0),
  down:  () => moveCursor(1, 0),
  left:  () => moveCursor(0, -1),
  right: () => moveCursor(0, 1)
};

  open:     activate,
  home:     () => cursorTo('HOME'),
  next:     () => cursorTo(ORDER[(ORDER.indexOf(active) + 1) % ORDER.length]),
  pageup:   () => scrollPage(-0.85),

});

// ------------------------------------------------------------------ layout
const W = 1240, H = 900, CROP = 150, GAP = 16;
let restY = 0, startY = 0, scale = 1, revealed = false;

function layout() {
  const vw = window.innerWidth, vh = window.innerHeight;
  scale = Math.min(vw * 0.97 / W, vh / (H - CROP), 1.5);
  const devH = H * scale;
  restY = devH + GAP <= vh ? (vh - devH) / 2 : vh - devH - GAP;
  startY = vh + 30;
  apply(revealed ? restY : startY);
}
function apply(y) {
  stage.style.transform = 'translateX(-50%) translateY(' + y + 'px) scale(' + scale + ')';
}
window.addEventListener('resize', layout);

// --------------------------------------------------------- slide + handoff
const SLIDE_MS = 950;
const easeOutCubic = t => 1 - Math.pow(1 - t, 3);
let slideStart = null;

function slide(ts) {
  if (!slideStart) slideStart = ts;
  const t = Math.min((ts - slideStart) / SLIDE_MS, 1);
  apply(startY + (restY - startY) * easeOutCubic(t));
  if (t < 1) requestAnimationFrame(slide);
}

window.PORTFOLIO.enterUI = function () {
  revealed = true;
  uiLayer.classList.add('on');
  layout();
  apply(startY);
  slideStart = null;
  requestAnimationFrame(slide);
};
window.PORTFOLIO.resetUI = function () {
  revealed = false;
  uiLayer.classList.remove('on');
  layout();
};

// ---------------------------------------------------------------- keyboard
const KEYMAP = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right' };
document.addEventListener('keydown', function (ev) {
  if (!revealed) return;
  if (ev.target && /^(INPUT|TEXTAREA)$/.test(ev.target.tagName)) return;
  const dir = KEYMAP[ev.key];
  if (dir) { ev.preventDefault(); tip(dir); DIR[dir](); return; }
  const hit = { Enter: 'open', Backspace: 'home', PageUp: 'pageup', PageDown: 'pagedown' }[ev.key];
  if (!hit) return;
  ev.preventDefault();
  press(document.querySelector('[data-act="' + hit + '"]'));
  ACTS[hit]();
});

paint();
layout();

})();
</script>

function drawPixelText(canvas, text, scale, color, gap) {
  const CW = 5, CH = 7;
  const chars = text.split('');
  const cells = chars.length * (CW + gap) - gap;
  canvas.width = Math.ceil(cells * scale);
  canvas.height = Math.ceil(CH * scale);

  });
}

  darkPad: '#15251b', green: '#84c95f', greenDark: '#5c9440',
  maroon: '#8f2a22', gold: '#e8b93c'
};

function blank() { return Array.from({length: GRID_R}, () => Array(GRID_C).fill(null)); }
function set(g, x, y, w, h, c) {
  for (let j = y; j < y + h; j++)
    for (let i = x; i < x + w; i++)
      if (i >= 0 && i < GRID_C && j >= 0 && j < GRID_R) g[j][i] = c;
}
function circle(g, cx, cy, r, c) {
  for (let j = Math.floor(cy - r); j <= Math.ceil(cy + r); j++)
    for (let i = Math.floor(cx - r); i <= Math.ceil(cx + r); i++) {
      const dx = i - cx, dy = j - cy;
      if (dx*dx + dy*dy <= r*r && i >= 0 && i < GRID_C && j >= 0 && j < GRID_R) g[j][i] = c;
    }
}
function roundRect(g, x, y, w, h, rad, c) {
  for (let j = 0; j < h; j++) {
    const d = Math.min(j, h - 1 - j);
    let ins = 0;
    if (d < rad) ins = Math.round(rad - Math.sqrt(Math.max(0, rad*rad - (rad-d)*(rad-d))));
    set(g, x + ins, y + j, w - 2*ins, 1, c);
  }
}

const LEFT = 8, RIGHT = 87, TOP = 4, BOT = 121;
const ORB_CX = 24, ORB_CY = 19;
const CRAD = 5;

function cornerInset(row, roundTop, roundBot) {
  let d = 1e9;
  if (roundTop) d = Math.min(d, row - TOP);
  if (roundBot) d = Math.min(d, BOT - row);
  if (d >= CRAD) return 0;
  return Math.round(CRAD - Math.sqrt(Math.max(0, CRAD*CRAD - (CRAD-d)*(CRAD-d))));
}

function ridgeRow(col) {
  const A = 40, B = 57, HI = 34, LO = 22;
  if (col <= A) return HI;
  if (col >= B) return LO;
  return Math.round(HI - (HI - LO) * (col - A) / (B - A));
}

function chamferRect(g, x, y, w, h, cham, c) {
  for (let j = 0; j < h; j++) {
    const fb = h - 1 - j;
    let x0 = x, w0 = w;
    if (fb < cham) { const cut = cham - fb; x0 = x + cut; w0 = w - cut; }
    if (w0 > 0) set(g, x0, y + j, w0, 1, c);
  }
}

function baseProfile(row) {
  if (row < TOP || row > BOT) return null;
  const ins = cornerInset(row, true, true);
  return [LEFT + ins, RIGHT - ins];
}
function lidProfile(row) {
  if (row > BOT) return null;
  let first = null;
  for (let c = LEFT; c <= RIGHT; c++) if (ridgeRow(c) <= row) { first = c; break; }
  if (first === null) return null;
  const ins = cornerInset(row, false, true);
  return [Math.max(first, LEFT + ins), RIGHT - ins];
}
function lidInnerProfile(row) {
  const b = lidProfile(row);
  if (!b) return null;
  return [MIRROR - b[1], MIRROR - b[0]];
}
function lidOuterProfile(row) {
  const b = lidProfile(row);
  if (!b) return null;
  return [Math.max(b[0], LEFT + 3), b[1]];
}

function fillProfile(g, fn, color) {
  for (let j = 0; j < GRID_R; j++) { const b = fn(j); if (b) set(g, b[0], j, b[1]-b[0]+1, 1, color); }
}
function bevelProfile(g, fn) {
  const rows = [];
  for (let j = 0; j < GRID_R; j++) if (fn(j)) rows.push(j);
  const r0 = rows[0], r1 = rows[rows.length-1];
  for (const j of rows) {
    const b = fn(j);
    set(g, b[0], j, 3, 1, P.redLight);
    set(g, b[1]-2, j, 3, 1, P.redShade);
    if (j <= r0 + 2) set(g, b[0], j, b[1]-b[0]+1, 1, P.redLight);
    if (j >= r1 - 2) set(g, b[0], j, b[1]-b[0]+1, 1, P.redShade);
  }
  for (const j of rows) { const b = fn(j); set(g, b[0], j, 1, 1, P.outline); set(g, b[1], j, 1, 1, P.outline); }
  const bt = fn(r0), bb = fn(r1);
  set(g, bt[0], r0, bt[1]-bt[0]+1, 1, P.outline);
  set(g, bb[0], r1, bb[1]-bb[0]+1, 1, P.outline);
}

function baseGrid() {
  const g = blank();
  fillProfile(g, baseProfile, P.red);
  bevelProfile(g, baseProfile);

  for (let c = LEFT + 1; c < RIGHT; c++) {
    const rr = ridgeRow(c);
    set(g, c, rr, 1, 1, P.redShade);
    set(g, c, rr + 1, 1, 1, P.redDark);
    set(g, c, rr - 1, 1, 1, P.redLight);
  }

  circle(g, ORB_CX, ORB_CY, 10.6, P.outline);
  circle(g, ORB_CX, ORB_CY, 9.6, P.chrome);
  circle(g, ORB_CX, ORB_CY, 7.8, P.outline);
  circle(g, ORB_CX, ORB_CY, 6.8, P.blueDark);
  circle(g, ORB_CX, ORB_CY, 5.2, P.blue);
  circle(g, ORB_CX - 2.4, ORB_CY - 2.6, 2.2, '#dff0ff');

  [[39,'#e0402f'],[45,'#f0c23c'],[51,'#5fae4f']].forEach(function(L) {
    circle(g, L[0], 11, 2.5, P.outline);
    circle(g, L[0], 11, 1.5, L[1]);
  });

  chamferRect(g, 16, 38, 58, 48, 9, P.outline);
  chamferRect(g, 17, 39, 56, 46, 8, P.chrome);
  set(g, 17, 39, 56, 2, '#fbfdfe');
  set(g, 23, 45, 44, 29, P.outline);
  set(g, 24, 46, 42, 27, P.screen);
  circle(g, 40, 42, 1.5, '#d0392c');
  circle(g, 48, 42, 1.5, '#d0392c');
  circle(g, 28, 80, 2.4, '#d0392c');
  for (let k = 0; k < 4; k++) set(g, 61, 76 + k*2, 5, 1, P.chromeDark);

  circle(g, 21, 93, 4.5, P.outline);
  circle(g, 21, 93, 3.5, '#1d1d22');
  circle(g, 19.8, 91.8, 1.2, '#3c3c46');

  roundRect(g, 32, 90, 9, 3, 1, P.outline);
  set(g, 33, 91, 7, 1, P.maroon);
  roundRect(g, 42, 90, 9, 3, 1, P.outline);
  set(g, 43, 91, 7, 1, '#3a8fd0');

  set(g, 32, 96, 19, 14, P.outline);
  set(g, 33, 97, 17, 12, P.greenDark);
  set(g, 33, 97, 17, 10, P.green);

  set(g, 61, 90, 7, 21, P.outline);
  set(g, 55, 97, 19, 7, P.outline);
  set(g, 62, 91, 5, 19, '#24242c');
  set(g, 56, 98, 17, 5, '#24242c');
  circle(g, 64, 100, 1.5, '#141419');

  return g;
}

function backPlateGrid() {
  const g = blank();
  fillProfile(g, baseProfile, P.redMid);
  bevelProfile(g, baseProfile);
  roundRect(g, 20, 42, 56, 32, 3, P.redShade);
  roundRect(g, 20, 88, 56, 12, 3, P.redShade);
  return g;
}

function lidOuterGrid() {
  const g = blank();
  fillProfile(g, lidOuterProfile, P.red);
  bevelProfile(g, lidOuterProfile);
  for (let j = 0; j < GRID_R; j++) {
    const b = lidOuterProfile(j);
    if (!b) continue;
    set(g, b[0] + 1, j, 2, 1, P.redShade);
  }
  for (let j = 0; j < GRID_R; j++) {
    const b = lidOuterProfile(j);
    if (!b) continue;
    set(g, b[1] - 5, j, 1, 1, P.redLight);
    set(g, b[1] - 4, j, 2, 1, P.red);
  }
  [40, 106].forEach(function(rr) {
    const b = lidOuterProfile(rr);
    if (b) set(g, b[1] - 5, rr, 6, 1, P.redShade);
  });

  const tri = [1,2,3,4,5,4,3,2,1];
  for (let k = 0; k < tri.length; k++) set(g, 15, 72 + k, tri[k], 1, P.gold);
  set(g, 32, 106, 32, 2, P.redDark);
  return g;
}

function lidInnerDesign() {
  const g = blank();
  fillProfile(g, lidInnerProfile, P.red);
  bevelProfile(g, lidInnerProfile);

  set(g, 16, 40, 60, 24, P.outline);
  set(g, 18, 42, 56, 20, P.screen);
  set(g, 18, 42, 56, 1, '#26262c');

  set(g, 16, 71, 61, 15, P.outline);
  for (let r = 0; r < 2; r++)
    for (let c = 0; c < 5; c++) {
      const x = 17 + c*12, y = 72 + r*7;
      set(g, x, y, 11, 6, P.blueMid);
      set(g, x, y, 11, 4, P.blue);
      set(g, x, y, 11, 1, '#7fc8f0');
    }

  set(g, 54, 87, 8, 2, P.outline);
  set(g, 64, 87, 8, 2, P.outline);

  set(g, 16, 91, 23, 10, P.outline);
  set(g, 17, 92, 10, 8, P.chrome);
  set(g, 28, 92, 10, 8, P.chrome);

  circle(g, 67, 95, 3.5, P.outline);
  circle(g, 67, 95, 2.6, P.yellowDark);
  circle(g, 67, 95, 1.8, P.yellow);
  circle(g, 66.2, 94.2, 0.8, '#ffe89a');

  set(g, 16, 106, 29, 11, P.outline);
  set(g, 17, 107, 27, 9, P.darkPad);
  set(g, 47, 106, 29, 11, P.outline);
  set(g, 48, 107, 27, 9, P.darkPad);

  return g;
}

const baseG = baseGrid();
const backG = backPlateGrid();
const lidOutG = lidOuterGrid();
const lidInG = lidInnerDesign();

function drawAtResolution(ctx, grid, Nc) {
  Nc = Math.max(4, Math.round(Nc));
  const Nr = Math.max(4, Math.round(Nc * GRID_R / GRID_C));
  const bw = W / Nc, bh = H / Nr;
  ctx.clearRect(0, 0, W, H);
  for (let j = 0; j < Nr; j++) {
    const sy = Math.min(GRID_R - 1, Math.floor(j * GRID_R / Nr));
    for (let i = 0; i < Nc; i++) {
      const sx = Math.min(GRID_C - 1, Math.floor(i * GRID_C / Nc));
      const c = grid[sy][sx];
      if (!c) continue;
      ctx.fillStyle = c;
      ctx.fillRect(i * bw, j * bh, bw + 0.6, bh + 0.6);
    }
  }
}

const BASE_SCREEN = {x: 24*BLOCK, y: 46*BLOCK, w: 42*BLOCK, h: 27*BLOCK};
const LID_SCREEN  = {x: 18*BLOCK, y: 42*BLOCK, w: 56*BLOCK, h: 20*BLOCK};
const LEDS = [
  {cx: 39*BLOCK, cy: 11*BLOCK, c: '#ff7a63'},
  {cx: 45*BLOCK, cy: 11*BLOCK, c: '#ffe08a'},
  {cx: 51*BLOCK, cy: 11*BLOCK, c: '#a6f090'}
];

function renderBase(N, screenW, ledGlows) {
  drawAtResolution(baseCtx, baseG, N);
  if (ledGlows) {
    LEDS.forEach(function(L, i) {
      const gl = ledGlows[i] || 0;
      if (gl <= 0) return;
      baseCtx.globalAlpha = Math.min(1, gl);
      baseCtx.fillStyle = L.c;
      baseCtx.beginPath();
      baseCtx.arc(L.cx, L.cy, 2.2 * BLOCK, 0, Math.PI * 2);
      baseCtx.fill();
      baseCtx.globalAlpha = 1;
    });
  }
  if (screenW > 0) {
    baseCtx.globalAlpha = Math.min(1, screenW);
    baseCtx.fillStyle = '#ffffff';
    baseCtx.fillRect(BASE_SCREEN.x, BASE_SCREEN.y, BASE_SCREEN.w, BASE_SCREEN.h);
    baseCtx.globalAlpha = 1;
  }
}

function renderLidInner(N, screenW) {
  drawAtResolution(lidInCtx, lidInG, N);
  if (screenW > 0) {
    lidInCtx.globalAlpha = Math.min(1, screenW);
    lidInCtx.fillStyle = '#ffffff';
    lidInCtx.fillRect(LID_SCREEN.x, LID_SCREEN.y, LID_SCREEN.w, LID_SCREEN.h);
    lidInCtx.globalAlpha = 1;
  }
}

function makeEdge(parent, side, x0, y0, x1, y1, depth, color) {
  const d = document.createElement('div');
  let css = 'position:absolute;background:' + color + ';backface-visibility:hidden;';
  if (side === 'left')
    css += `top:${y0}px;left:0;width:${depth}px;height:${y1-y0}px;transform-origin:100% 50%;transform:translateX(${x0-depth}px) rotateY(-90deg);`;
  else if (side === 'right')
    css += `top:${y0}px;left:0;width:${depth}px;height:${y1-y0}px;transform-origin:0% 50%;transform:translateX(${x1}px) rotateY(90deg);`;
  else if (side === 'bottom')
    css += `top:0;left:${x0}px;width:${x1-x0}px;height:${depth}px;transform-origin:50% 0%;transform:translateY(${y1}px) rotateX(-90deg);`;
  d.style.cssText = css;
  parent.appendChild(d);
}

const DEPTH = 34;
const BX0 = LEFT*BLOCK, BX1 = (RIGHT+1)*BLOCK, BY1 = (BOT+1)*BLOCK;

const hingeParts = [];
function setHinge(v) { hingeParts.forEach(function(d) { d.style.visibility = v; }); }

function buildSolids() {
  makeEdge(rig, 'left',   BX0, 10*BLOCK, BX1, BY1-10, DEPTH, '#8f2018');
  makeEdge(rig, 'right',  BX0, 10*BLOCK, BX1, BY1-10, DEPTH, '#5c150f');
  makeEdge(rig, 'bottom', BX0+10, 0, BX1-10, BY1, DEPTH, '#4a1009');

  makeEdge(lidHinge, 'left',   BX0, 36*BLOCK, BX1, BY1-10, DEPTH, '#8f2018');
  makeEdge(lidHinge, 'right',  BX0, 24*BLOCK, BX1, BY1-10, DEPTH, '#5c150f');
  makeEdge(lidHinge, 'bottom', BX0+10, 0, BX1-10, BY1, DEPTH, '#4a1009');

  const n = 20, r = 25;
  const w = 2 * r * Math.sin(Math.PI / n);
  const ap = r * Math.cos(Math.PI / n);
  const hTop = 22 * BLOCK, hLen = BY1 - hTop;
  const hCx = BX1 - r + 2;
  const zOff = 12;
  const L1 = 40, L2 = 45;
  for (let i = 0; i < n; i++) {
    const ang = i * (360 / n);
    const lit = Math.max(0, Math.cos((ang + 35) * Math.PI / 180));
    const f = 0.16 + 0.84 * lit;
    const col = `rgb(${Math.round(224*f)},${Math.round(80*f)},${Math.round(58*f)})`;
    const dk = `rgb(${Math.round(224*f*0.32)},${Math.round(80*f*0.32)},${Math.round(58*f*0.32)})`;
    const bg = `linear-gradient(to bottom, ${col} 0px, ${col} ${L1}px, ${dk} ${L1}px, ${dk} ${L2}px,`
      + ` ${col} ${L2}px, ${col} ${hLen-L2}px, ${dk} ${hLen-L2}px, ${dk} ${hLen-L1}px, ${col} ${hLen-L1}px)`;
    const d = document.createElement('div');
    d.style.cssText = `position:absolute;top:${hTop}px;left:0;width:${w+0.8}px;height:${hLen}px;`
      + `background:${bg};transform-origin:50% 50%;`
      + `transform:translateX(${hCx - w/2}px) translateZ(${-zOff}px) rotateY(${ang}deg) translateZ(${ap}px);`;
    rig.appendChild(d);
    hingeParts.push(d);
  }

  [[hTop, '#7d1f16', 90], [hTop + hLen, '#280705', -90]].forEach(function(capDef) {
    const cap = document.createElement('div');
    cap.style.cssText = `position:absolute;top:0;left:0;width:${2*r}px;height:${2*r}px;`
      + `border-radius:50%;background:${capDef[1]};transform-origin:50% 50%;`
      + `transform:translateX(${hCx - r}px) translateY(${capDef[0] - r}px)`
      + ` translateZ(${-zOff}px) rotateX(${capDef[2]}deg);`;
    rig.appendChild(cap);
    hingeParts.push(cap);
  });
}
buildSolids();

function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }

const IDLE_SCALE = 0.5;
const FINAL_SCALE = 0.74;
const SPIN_MS = 1300, SETTLE_MS = 280, OPEN_MS = 800;
const SCREEN_ON_MS = 560, FLASH_MS = 1250;
const OPEN_ANGLE = 150;
const SHIFT = -152;

function rigT(s, extraY, shiftX) {
  return `translateX(${shiftX}px) scale3d(${s},${s},${s}) rotateX(8deg) rotateY(${12 + extraY}deg)`;
}

let idleActive = false, idleRAF = null, idleStart = null;
let nextShakeAt = 700 + Math.random() * 900, shaking = false;

function idleFrame(ts) {
  if (!idleActive) return;
  if (!idleStart) idleStart = ts;
  const e = ts - idleStart;
  let bobY = Math.sin(e / 480) * 6;
  let swayX = Math.sin(e / 700 + 0.6) * 4;
  let rotZ = Math.sin(e / 620) * 1.5;
  if (e >= nextShakeAt && e < nextShakeAt + 500) {
    const p = (e - nextShakeAt) / 500;
    const env = Math.sin(p * Math.PI);
    bobY += -Math.sin(p * Math.PI) * 10;
    swayX += Math.sin(p * 16) * 3.5 * env;
    rotZ += Math.sin(p * 14) * 2.5 * env;
    shaking = true;
  } else if (shaking) {
    shaking = false;
    nextShakeAt = e + 1100 + Math.random() * 1200;
  }
  rigWrap.style.transform = `translate(${swayX}px, ${bobY}px) rotate(${rotZ}deg)`;
  idleRAF = requestAnimationFrame(idleFrame);
}

function startIdle() {
  idleActive = true; idleStart = null;
  nextShakeAt = 700 + Math.random() * 900; shaking = false;
  lidInnerEl.style.visibility = 'hidden';
  setHinge('hidden');
  renderBase(GRID_C, 0, null);
  drawAtResolution(backCtx, backG, GRID_C);
  drawAtResolution(lidOutCtx, lidOutG, GRID_C);
  renderLidInner(GRID_C, 0);
  rig.style.transform = rigT(IDLE_SCALE, 0, 0);
  lidHinge.style.transform = 'rotateY(0deg)';
  idleRAF = requestAnimationFrame(idleFrame);
}
function stopIdle() {
  idleActive = false;
  if (idleRAF) cancelAnimationFrame(idleRAF);
  rigWrap.style.transform = 'none';
}

let spinStart = null;
function animateSpin(ts) {
  if (!spinStart) spinStart = ts;
  const t = Math.min((ts - spinStart) / SPIN_MS, 1);
  const e = easeOutCubic(t);
  const N = 8 + e * (GRID_C - 8);
  const s = IDLE_SCALE + e * (FINAL_SCALE - IDLE_SCALE);
  rig.style.transform = rigT(s, (1 - e) * 1.2 * 360, e * SHIFT);
  renderBase(N, 0, null);
  drawAtResolution(backCtx, backG, N);
  drawAtResolution(lidOutCtx, lidOutG, N);
  if (t < 1) requestAnimationFrame(animateSpin);
  else {
    renderBase(GRID_C, 0, null);
    drawAtResolution(backCtx, backG, GRID_C);
    drawAtResolution(lidOutCtx, lidOutG, GRID_C);
    renderLidInner(GRID_C, 0);
    rig.style.transition = `transform ${SETTLE_MS}ms ease-out`;
    rig.style.transform = rigT(FINAL_SCALE, 0, SHIFT);
    setTimeout(startFlip, SETTLE_MS + 150);
  }
}

let flipStart = null;
function animateFlip(ts) {
  if (!flipStart) flipStart = ts;
  const t = Math.min((ts - flipStart) / OPEN_MS, 1);
  lidHinge.style.transform = `rotateY(${OPEN_ANGLE * easeOutCubic(t)}deg)`;
  if (t < 1) requestAnimationFrame(animateFlip);
  else setTimeout(startScreenOn, 100);
}
function startFlip() {
  flipStart = null;
  lidInnerEl.style.visibility = 'visible';
  setHinge('visible');
  lidHinge.style.transition = 'none';
  requestAnimationFrame(animateFlip);
}

let screenOnStart = null;
function animateScreenOn(ts) {
  if (!screenOnStart) screenOnStart = ts;
  const t = Math.min((ts - screenOnStart) / SCREEN_ON_MS, 1);
  const glows = [0, 1, 2].map(function(i) {
    const st = 0.04 + i * 0.17, du = 0.26;
    const q = (t - st) / du;
    return (q < 0 || q > 1) ? 0 : Math.sin(q * Math.PI);
  });
  const screenW = Math.max(0, Math.min(1, (t - 0.04) / 0.80));
  renderBase(GRID_C, screenW, glows);
  renderLidInner(GRID_C, screenW);
  if (t < 1) requestAnimationFrame(animateScreenOn);
  else startFlash();
}
function startScreenOn() {
  screenOnStart = null;
  requestAnimationFrame(animateScreenOn);
}

function sizeFullFlash() {
  fullFlash.width = window.innerWidth;
  fullFlash.height = window.innerHeight;
}

const RAY_DIRS = [-82, -54, -28, -6, 18, 44, 74, 106, 139, 168, -158, -122]
  .map(function(deg, n) {
    const a = deg * Math.PI / 180;
    return [Math.cos(a), Math.sin(a), 0.82 + 0.18 * ((n * 5) % 7) / 6];
  });

let flashStart = null, flashOx = 0, flashOy = 0, flashMaxR = 1, flashR0 = 0;
function animateFlash(ts) {
  if (!flashStart) flashStart = ts;
  const t = Math.min((ts - flashStart) / FLASH_MS, 1);
  const FW = fullFlash.width, FH = fullFlash.height;
  const block = 20;
  const c = Math.ceil(FW / block), r = Math.ceil(FH / block);
  const core   = flashR0 * 0.35 + Math.pow(t, 3.2) * flashMaxR * 2.0;
  const rayLen = flashR0 * 0.35 + t * flashMaxR * 2.4;
  const spread = 0.030 + 0.55 * Math.pow(t, 3.6);
  const W0 = block * 0.45;
  flashCtx.clearRect(0, 0, FW, FH);
  flashCtx.fillStyle = '#ffffff';
  for (let j = 0; j < r; j++)
    for (let i = 0; i < c; i++) {
      const cx = i * block + block / 2, cy = j * block + block / 2;
      const dx = cx - flashOx, dy = cy - flashOy;
      const d = Math.sqrt(dx * dx + dy * dy);
      const jit = (((i * 13 + j * 7) % 5) - 2) * block * 0.15;
      if (d + jit <= core) { flashCtx.fillRect(i * block, j * block, block, block); continue; }
      for (let n = 0; n < RAY_DIRS.length; n++) {
        const R = RAY_DIRS[n];
        const pAlong = dx * R[0] + dy * R[1];
        if (pAlong <= 0) continue;
        const qPerp = Math.abs(-dx * R[1] + dy * R[0]);
        if (qPerp <= W0 + pAlong * spread && pAlong + jit <= rayLen * R[2]) {
          flashCtx.fillRect(i * block, j * block, block, block);
          break;
        }
      }
    }
  if (t < 1) requestAnimationFrame(animateFlash);
  else handoff();
}
function startFlash() {
  sizeFullFlash();
  const rect = document.getElementById('base').getBoundingClientRect();
  flashOx = rect.left + rect.width * 0.469;
  flashOy = rect.top + rect.height * 0.472;
  flashR0 = Math.max(rect.width, rect.height) * 0.12;
  const FW = fullFlash.width, FH = fullFlash.height;
  flashMaxR = Math.max(
    Math.sqrt(flashOx*flashOx + flashOy*flashOy),
    Math.sqrt((FW-flashOx)*(FW-flashOx) + flashOy*flashOy),
    Math.sqrt(flashOx*flashOx + (FH-flashOy)*(FH-flashOy)),
    Math.sqrt((FW-flashOx)*(FW-flashOx) + (FH-flashOy)*(FH-flashOy))
  );
  fullFlash.style.opacity = 1;
  flashStart = null;
  requestAnimationFrame(animateFlash);
}

/* ----------------------------------------------------------------- handoff
   The frame is solid white here, so the swap is invisible: drop the landing
   scene, start the UI sliding up underneath, then dissolve the white away. */
const FADE_DELAY = 140, FADE_MS = 700;
function handoff() {
  flashCtx.fillRect(0, 0, fullFlash.width, fullFlash.height);
  stopIdle();
  landingEl.classList.add('gone');
  window.PORTFOLIO.enterUI();
  setTimeout(function () {
    fullFlash.style.transition = `opacity ${FADE_MS}ms ease`;
    fullFlash.style.opacity = 0;
  }, FADE_DELAY);
  setTimeout(function () {
    replayBtn.classList.add('visible');
  }, FADE_DELAY + FADE_MS + 200);
}

function launchSequence() {
  stopIdle();
  rigWrap.style.transform = 'none';
  titleWrap.style.transition = 'opacity 300ms ease';
  titleWrap.style.opacity = 0;
  rigWrap.style.pointerEvents = 'none';
  spinStart = flipStart = screenOnStart = flashStart = null;
  rig.style.transition = 'none';
  lidHinge.style.transform = 'rotateY(0deg)';
  requestAnimationFrame(animateSpin);
}

function resetAll() {
  replayBtn.classList.remove('visible');
  window.PORTFOLIO.resetUI();
  landingEl.classList.remove('gone');
  fullFlash.style.transition = 'none';
  fullFlash.style.opacity = 0;
  flashCtx.clearRect(0, 0, fullFlash.width, fullFlash.height);
  titleWrap.style.transition = 'none';
  titleWrap.style.opacity = 1;
  rigWrap.style.pointerEvents = 'auto';
  rig.style.transition = 'none';
  lidHinge.style.transition = 'none';
  startIdle();
}

rigWrap.addEventListener('click', launchSequence);
replayBtn.addEventListener('click', resetAll);
window.addEventListener('resize', sizeFullFlash);

sizeFullFlash();
resetAll();

})();
</script>
