<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daniel Wang — Pokedex Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  /* ============================================================ foundation */
  :root {
    --fd: 'Chakra Petch', 'Segoe UI', sans-serif;      /* labels, keys, headings */
    --fb: 'IBM Plex Sans', system-ui, sans-serif;      /* running text */
    --fm: 'IBM Plex Mono', ui-monospace, monospace;    /* data, meta */

    /* injection-moulded red plastic */
    --shell-lit:  #f4715a;
    --shell:      #d83f2b;
    --shell-mid:  #bb3120;
    --shell-deep: #8d2214;
    --shell-edge: #5e150c;

    --cream:      #f4f6f7;
    --cream-mid:  #d5dade;
    --cream-deep: #9ba3a9;

    --glass:      #101715;
    --glass-lit:  #0d1f12;

    --amber:      #ffc53d;
    --ink:        #10151a;
  }

  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #07080a;
    overflow: hidden;
    font-family: var(--fb);
  }

  /* ============================================================ layer stack
     #uiLayer   z1  — the device, hidden until the flash hands over
     #landing   z10 — pixel intro, removed once it has handed over
     #fullFlash z20 — the white burst that covers the swap
     #replay    z30 — always reachable
     ====================================================================== */

  #uiLayer {
    position: fixed; inset: 0; z-index: 1;
    background:
      radial-gradient(120% 90% at 50% 12%, #1c1f26 0%, #0a0b0f 60%, #06070a 100%);
    opacity: 0; visibility: hidden;
    overflow: hidden;
  }
  #uiLayer.on { opacity: 1; visibility: visible; }

  #landing {
    position: fixed; inset: 0; z-index: 10;
    background: #0b0b0d;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
  }
  #landing.gone { display: none; }

  #titleWrap { text-align: center; margin-bottom: -108px; position: relative; top: -58px; z-index: 4; }
  #titleCanvas { display: block; margin: 0 auto; image-rendering: pixelated; }
  #hintCanvas {
    display: block; margin: 26px auto 0; image-rendering: pixelated;
    animation: hintPulse 2.4s ease-in-out infinite;
  }
  @keyframes hintPulse { 0%, 100% { opacity: 0.12; } 50% { opacity: 1; } }

  #rigWrap { position: relative; width: 432px; height: 567px; cursor: pointer; perspective: 1700px; }
  #rig { position: relative; width: 432px; height: 567px; transform-style: preserve-3d; }
  canvas.face { position: absolute; top: 0; left: 0; image-rendering: pixelated; }
  #base, #backPlate, #lidOuter, #lidInner { backface-visibility: hidden; }
  #backPlate { transform: rotateY(180deg); }
  #lidHinge {
    position: absolute; top: 0; left: 0; width: 432px; height: 567px;
    transform-origin: 91.667% 50%; transform-style: preserve-3d;
  }
  #lidInner { transform: rotateY(180deg); visibility: hidden; }

  #fullFlash {
    position: fixed; top: 0; left: 0;
    image-rendering: pixelated;
    z-index: 20; pointer-events: none; opacity: 0;
  }

  #replay {
    position: fixed; bottom: 24px; right: 24px; z-index: 30;
    background: rgba(255,255,255,0.04); border: 1px solid #35353f; color: #8b8b98;
    font-family: var(--fm); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase;
    padding: 9px 18px; border-radius: 7px; cursor: pointer;
    opacity: 0; pointer-events: none; transition: opacity 300ms ease, color 160ms, border-color 160ms;
    backdrop-filter: blur(6px);
  }
  #replay.visible { opacity: 1; pointer-events: auto; }
  #replay:hover { color: #fff; border-color: #6a6a78; background: rgba(255,255,255,0.09); }

  /* ================================================================ device
     A real object rendered in DOM: moulded plastic, domed keys, glass. The
     whole thing is authored at a fixed design size and scaled to fit, so
     every proportion holds at any viewport.
     ====================================================================== */
  #stage {
    position: absolute; left: 50%; top: 0;
    width: 1196px; height: 880px;
    transform-origin: 50% 0;
    will-change: transform;
  }

  .dex {
    position: absolute; inset: 0;
    display: grid;
    grid-template-columns: 560px 76px 560px;
    filter: drop-shadow(0 40px 70px rgba(0,0,0,0.65));
  }

  /* ------------------------------------------------------------- the halves */
  .half {
    position: relative;
    background:
      linear-gradient(158deg,
        var(--shell-lit) 0%, var(--shell) 26%,
        var(--shell-mid) 58%, var(--shell-deep) 88%, var(--shell-edge) 100%);
    box-shadow:
      inset 0 2px 0 rgba(255,255,255,0.34),
      inset 2px 0 0 rgba(255,255,255,0.12),
      inset -2px 0 0 rgba(0,0,0,0.28),
      inset 0 -3px 0 rgba(0,0,0,0.40);
  }
  /* a soft sheen raking across the plastic */
  .half::before {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(118deg,
      rgba(255,255,255,0.20) 0%, rgba(255,255,255,0.05) 22%,
      rgba(255,255,255,0) 46%, rgba(0,0,0,0.10) 100%);
  }

  .half.left  { border-radius: 26px 6px 6px 26px; }
  .half.right { border-radius: 6px 26px 26px 6px; margin-top: 96px; height: 784px; }

  .half > * { position: relative; z-index: 1; }

  /* --------------------------------------------------------------- top band */
  .topband {
    height: 152px;
    display: flex; align-items: center; gap: 26px;
    padding: 0 30px;
  }
  .orb {
    width: 104px; height: 104px; border-radius: 50%; flex: none;
    background:
      radial-gradient(circle at 34% 28%, #eafaff 0%, #7fd4f4 22%, #2e9fd6 52%, #15618f 82%, #0a3b5c 100%);
    box-shadow:
      0 0 0 7px #eef1f3,
      0 0 0 9px rgba(0,0,0,0.45),
      inset 0 -8px 16px rgba(0,0,0,0.45),
      0 8px 18px rgba(0,0,0,0.45);
    position: relative;
  }
  .orb::after {
    content: ""; position: absolute;
    left: 20%; top: 13%; width: 34%; height: 26%;
    border-radius: 50%;
    background: linear-gradient(160deg, rgba(255,255,255,0.95), rgba(255,255,255,0));
    filter: blur(1px);
  }
  .leds { display: flex; gap: 16px; }
  .led {
    width: 30px; height: 30px; border-radius: 50%;
    box-shadow: inset 0 -3px 6px rgba(0,0,0,0.5), 0 0 0 3px rgba(0,0,0,0.4), 0 0 14px 2px var(--glow);
    background: radial-gradient(circle at 34% 28%, #ffffff 0%, var(--c) 46%, var(--d) 100%);
  }

  /* ----------------------------------------------------------- screen frame */
  .frame {
    margin: 0 24px;
    height: 452px;
    background: linear-gradient(168deg, #ffffff 0%, var(--cream) 30%, var(--cream-mid) 88%, var(--cream-deep) 100%);
    clip-path: polygon(0 0, 100% 0, 100% 100%, 78px 100%, 0 calc(100% - 78px));
    box-shadow: 0 8px 20px rgba(0,0,0,0.4);
    padding: 20px 20px 0;
    display: flex; flex-direction: column;
  }
  .frame .lamps { display: flex; gap: 14px; justify-content: center; margin-bottom: 14px; }
  .frame .lamp {
    width: 16px; height: 16px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #ff9d8e, #c03726 60%, #7d2013);
    box-shadow: inset 0 -2px 3px rgba(0,0,0,0.45), 0 0 0 2px rgba(0,0,0,0.28);
  }

  .glass {
    flex: 1; min-height: 0;
    border-radius: 12px;
    background: linear-gradient(170deg, #1c2624 0%, var(--glass) 42%, #080d0c 100%);
    box-shadow:
      inset 0 0 0 3px rgba(0,0,0,0.65),
      inset 0 8px 22px rgba(0,0,0,0.7),
      0 2px 0 rgba(255,255,255,0.6);
    position: relative;
    overflow: hidden;
  }
  /* the reflection on the cover glass */
  .glass::after {
    content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 3;
    background: linear-gradient(126deg,
      rgba(255,255,255,0.11) 0%, rgba(255,255,255,0.03) 26%,
      rgba(255,255,255,0) 52%);
  }

  .frame .foot { height: 60px; display: flex; align-items: center; padding: 0 4px 0 84px; }
  .foot .dot {
    width: 20px; height: 20px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #ff9d8e, #c03726 60%, #7d2013);
    box-shadow: inset 0 -2px 3px rgba(0,0,0,0.45), 0 0 0 2px rgba(0,0,0,0.25);
  }
  .foot .grille { margin-left: auto; display: grid; gap: 5px; }
  .foot .grille i {
    display: block; width: 78px; height: 3px; border-radius: 2px;
    background: linear-gradient(90deg, var(--cream-deep), #b9c0c5);
    box-shadow: 0 1px 0 rgba(255,255,255,0.8);
  }

  /* ---------------------------------------------------------- left controls */
  .controls {
    height: 260px;
    padding: 18px 26px 0;
    display: grid;
    grid-template-columns: auto 1fr auto;
    grid-template-rows: auto 1fr;
    column-gap: 20px; row-gap: 14px;
    align-items: start;
  }
  .pillrow { display: flex; gap: 14px; align-items: center; }

  /* ------------------------------------------------------------ right half */
  .sidewrap { padding: 26px 24px 0; }
  .sidescreen {
    height: 132px; border-radius: 10px;
    background: linear-gradient(170deg, #1b2422 0%, #0e1513 45%, #070b0a 100%);
    box-shadow:
      inset 0 0 0 3px rgba(0,0,0,0.6),
      inset 0 6px 18px rgba(0,0,0,0.65),
      0 2px 0 rgba(255,255,255,0.16);
    padding: 0 22px;
    display: flex; flex-direction: column; justify-content: center; gap: 7px;
    overflow: hidden;
  }

  .keypad {
    margin: 26px 24px 0;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 9px;
  }

  .strip { margin: 22px 24px 0; display: flex; align-items: center; gap: 16px; }
  .strip .bar {
    width: 84px; height: 9px; border-radius: 5px;
    background: linear-gradient(180deg, #1b1b21, #0a0a0e);
    box-shadow: inset 0 1px 2px rgba(0,0,0,0.8), 0 1px 0 rgba(255,255,255,0.22);
  }

  .lowrow { margin: 18px 24px 0; display: flex; align-items: center; gap: 14px; }
  .tiles { margin: 20px 24px 0; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

  /* ---------------------------------------------------------------- hinge */
  .hinge {
    background: linear-gradient(90deg,
      #6b1a10 0%, #9c2717 14%, #d03a24 34%, #f0715a 50%,
      #d03a24 66%, #9c2717 86%, #6b1a10 100%);
    box-shadow: inset 0 2px 0 rgba(255,255,255,0.22), inset 0 -3px 0 rgba(0,0,0,0.45);
    border-radius: 5px;
    position: relative;
    margin: 74px 0 0;
  }
  .hinge::before, .hinge::after {
    content: ""; position: absolute; left: 0; right: 0; height: 16px;
    background: linear-gradient(180deg, rgba(0,0,0,0.55), rgba(0,0,0,0.15));
    box-shadow: 0 1px 0 rgba(255,255,255,0.14);
  }
  .hinge::before { top: 58px; }
  .hinge::after  { bottom: 58px; }
</style>
</head>

<!-- =====================================================================
     SCENE 1 — the opening animation (was landing.html)
     ===================================================================== -->
<script>
(function () {

const GLYPHS = {
  'A': ['.###.','#...#','#...#','#####','#...#','#...#','#...#'],
  'C': ['.####','#....','#....','#....','#....','#....','.####'],
  'D': ['####.','#...#','#...#','#...#','#...#','#...#','####.'],
  'E': ['#####','#....','#....','####.','#....','#....','#####'],
  'I': ['#####','..#..','..#..','..#..','..#..','..#..','#####'],
  'K': ['#...#','#..#.','#.#..','##...','#.#..','#..#.','#...#'],
  'L': ['#....','#....','#....','#....','#....','#....','#####'],
  'N': ['#...#','##..#','##..#','#.#.#','#..##','#..##','#...#'],
  'O': ['.###.','#...#','#...#','#...#','#...#','#...#','.###.'],
  'P': ['####.','#...#','#...#','####.','#....','#....','#....'],
  'S': ['.####','#....','#....','.###.','....#','....#','####.'],
  'T': ['#####','..#..','..#..','..#..','..#..','..#..','..#..'],
  'X': ['#...#','#...#','.#.#.','..#..','.#.#.','#...#','#...#'],
  "'": ['..#..','..#..','.....','.....','.....','.....','.....'],
  ' ': ['.....','.....','.....','.....','.....','.....','.....']
};

function drawPixelText(canvas, text, scale, color, gap) {
  const CW = 5, CH = 7;
  const chars = text.split('');
  const cells = chars.length * (CW + gap) - gap;
  canvas.width = Math.ceil(cells * scale);
  canvas.height = Math.ceil(CH * scale);
  const c2 = canvas.getContext('2d');
  c2.clearRect(0, 0, canvas.width, canvas.height);
  c2.fillStyle = color;
  chars.forEach(function(chr, idx) {
    const gl = GLYPHS[chr.toUpperCase()];
    if (!gl) return;
    for (let r = 0; r < CH; r++)
      for (let c = 0; c < CW; c++)
        if (gl[r][c] === '#')
          c2.fillRect(Math.round((idx * (CW + gap) + c) * scale), Math.round(r * scale),
                      Math.ceil(scale), Math.ceil(scale));
  });
}

drawPixelText(document.getElementById('titleCanvas'), "DANIEL'S POKEDEX", 2, '#ffffff', 2);
drawPixelText(document.getElementById('hintCanvas'), 'CLICK TO OPEN', 1.35, '#ffffff', 2);

const W = 432, H = 567;
const GRID_C = 96, GRID_R = 126;
const BLOCK = W / GRID_C;
const MIRROR = GRID_C - 1;

const baseCtx = document.getElementById('base').getContext('2d');
const backCtx = document.getElementById('backPlate').getContext('2d');
const lidOutCtx = document.getElementById('lidOuter').getContext('2d');
const lidInCtx = document.getElementById('lidInner').getContext('2d');
const lidInnerEl = document.getElementById('lidInner');
const rig = document.getElementById('rig');
const rigWrap = document.getElementById('rigWrap');
const lidHinge = document.getElementById('lidHinge');
const titleWrap = document.getElementById('titleWrap');
const replayBtn = document.getElementById('replay');
const fullFlash = document.getElementById('fullFlash');
const flashCtx = fullFlash.getContext('2d');
const landingEl = document.getElementById('landing');

const P = {
  red: '#d6362a', redLight: '#ec5f52', redMid: '#c02e23',
  redDark: '#9c231a', redShade: '#7a1a13',
  outline: '#0a0a0c', screen: '#131316',
  chrome: '#eef1f3', chromeMid: '#cdd3d8', chromeDark: '#8f979e',
  blue: '#54b0e4', blueMid: '#3a94cc', blueDark: '#1f6f9c',
  yellow: '#f0c23c', yellowDark: '#b8891f',
  darkPad: '#15251b', green: '#84c95f', greenDark: '#5c9440',
  maroon: '#8f2a22', gold: '#e8b93c'
};

function blank() { return Array.from({length: GRID_R}, () => Array(GRID_C).fill(null)); }
function set(g, x, y, w, h, c) {
  for (let j = y; j < y + h; j++)
    for (let i = x; i < x + w; i++)
      if (i >= 0 && i < GRID_C && j >= 0 && j < GRID_R) g[j][i] = c;
}
function circle(g, cx, cy, r, c) {
  for (let j = Math.floor(cy - r); j <= Math.ceil(cy + r); j++)
    for (let i = Math.floor(cx - r); i <= Math.ceil(cx + r); i++) {
      const dx = i - cx, dy = j - cy;
      if (dx*dx + dy*dy <= r*r && i >= 0 && i < GRID_C && j >= 0 && j < GRID_R) g[j][i] = c;
    }
}
function roundRect(g, x, y, w, h, rad, c) {
  for (let j = 0; j < h; j++) {
    const d = Math.min(j, h - 1 - j);
    let ins = 0;
    if (d < rad) ins = Math.round(rad - Math.sqrt(Math.max(0, rad*rad - (rad-d)*(rad-d))));
    set(g, x + ins, y + j, w - 2*ins, 1, c);
  }
}

const LEFT = 8, RIGHT = 87, TOP = 4, BOT = 121;
const ORB_CX = 24, ORB_CY = 19;
const CRAD = 5;

function cornerInset(row, roundTop, roundBot) {
  let d = 1e9;
  if (roundTop) d = Math.min(d, row - TOP);
  if (roundBot) d = Math.min(d, BOT - row);
  if (d >= CRAD) return 0;
  return Math.round(CRAD - Math.sqrt(Math.max(0, CRAD*CRAD - (CRAD-d)*(CRAD-d))));
}

function ridgeRow(col) {
  const A = 40, B = 57, HI = 34, LO = 22;
  if (col <= A) return HI;
  if (col >= B) return LO;
  return Math.round(HI - (HI - LO) * (col - A) / (B - A));
}

function chamferRect(g, x, y, w, h, cham, c) {
  for (let j = 0; j < h; j++) {
    const fb = h - 1 - j;
    let x0 = x, w0 = w;
    if (fb < cham) { const cut = cham - fb; x0 = x + cut; w0 = w - cut; }
    if (w0 > 0) set(g, x0, y + j, w0, 1, c);
  }
}

function baseProfile(row) {
  if (row < TOP || row > BOT) return null;
  const ins = cornerInset(row, true, true);
  return [LEFT + ins, RIGHT - ins];
}
function lidProfile(row) {
  if (row > BOT) return null;
  let first = null;
  for (let c = LEFT; c <= RIGHT; c++) if (ridgeRow(c) <= row) { first = c; break; }
  if (first === null) return null;
  const ins = cornerInset(row, false, true);
  return [Math.max(first, LEFT + ins), RIGHT - ins];
}
function lidInnerProfile(row) {
  const b = lidProfile(row);
  if (!b) return null;
  return [MIRROR - b[1], MIRROR - b[0]];
}
function lidOuterProfile(row) {
  const b = lidProfile(row);
  if (!b) return null;
  return [Math.max(b[0], LEFT + 3), b[1]];
}

function fillProfile(g, fn, color) {
  for (let j = 0; j < GRID_R; j++) { const b = fn(j); if (b) set(g, b[0], j, b[1]-b[0]+1, 1, color); }
}
function bevelProfile(g, fn) {
  const rows = [];
  for (let j = 0; j < GRID_R; j++) if (fn(j)) rows.push(j);
  const r0 = rows[0], r1 = rows[rows.length-1];
  for (const j of rows) {
    const b = fn(j);
    set(g, b[0], j, 3, 1, P.redLight);
    set(g, b[1]-2, j, 3, 1, P.redShade);
    if (j <= r0 + 2) set(g, b[0], j, b[1]-b[0]+1, 1, P.redLight);
    if (j >= r1 - 2) set(g, b[0], j, b[1]-b[0]+1, 1, P.redShade);
  }
  for (const j of rows) { const b = fn(j); set(g, b[0], j, 1, 1, P.outline); set(g, b[1], j, 1, 1, P.outline); }
  const bt = fn(r0), bb = fn(r1);
  set(g, bt[0], r0, bt[1]-bt[0]+1, 1, P.outline);
  set(g, bb[0], r1, bb[1]-bb[0]+1, 1, P.outline);
}

function baseGrid() {
  const g = blank();
  fillProfile(g, baseProfile, P.red);
  bevelProfile(g, baseProfile);

  for (let c = LEFT + 1; c < RIGHT; c++) {
    const rr = ridgeRow(c);
    set(g, c, rr, 1, 1, P.redShade);
    set(g, c, rr + 1, 1, 1, P.redDark);
    set(g, c, rr - 1, 1, 1, P.redLight);
  }

  circle(g, ORB_CX, ORB_CY, 10.6, P.outline);
  circle(g, ORB_CX, ORB_CY, 9.6, P.chrome);
  circle(g, ORB_CX, ORB_CY, 7.8, P.outline);
  circle(g, ORB_CX, ORB_CY, 6.8, P.blueDark);
  circle(g, ORB_CX, ORB_CY, 5.2, P.blue);
  circle(g, ORB_CX - 2.4, ORB_CY - 2.6, 2.2, '#dff0ff');

  [[39,'#e0402f'],[45,'#f0c23c'],[51,'#5fae4f']].forEach(function(L) {
    circle(g, L[0], 11, 2.5, P.outline);
    circle(g, L[0], 11, 1.5, L[1]);
  });

  chamferRect(g, 16, 38, 58, 48, 9, P.outline);
  chamferRect(g, 17, 39, 56, 46, 8, P.chrome);
  set(g, 17, 39, 56, 2, '#fbfdfe');
  set(g, 23, 45, 44, 29, P.outline);
  set(g, 24, 46, 42, 27, P.screen);
  circle(g, 40, 42, 1.5, '#d0392c');
  circle(g, 48, 42, 1.5, '#d0392c');
  circle(g, 28, 80, 2.4, '#d0392c');
  for (let k = 0; k < 4; k++) set(g, 61, 76 + k*2, 5, 1, P.chromeDark);

  circle(g, 21, 93, 4.5, P.outline);
  circle(g, 21, 93, 3.5, '#1d1d22');
  circle(g, 19.8, 91.8, 1.2, '#3c3c46');

  roundRect(g, 32, 90, 9, 3, 1, P.outline);
  set(g, 33, 91, 7, 1, P.maroon);
  roundRect(g, 42, 90, 9, 3, 1, P.outline);
  set(g, 43, 91, 7, 1, '#3a8fd0');

  set(g, 32, 96, 19, 14, P.outline);
  set(g, 33, 97, 17, 12, P.greenDark);
  set(g, 33, 97, 17, 10, P.green);

  set(g, 61, 90, 7, 21, P.outline);
  set(g, 55, 97, 19, 7, P.outline);
  set(g, 62, 91, 5, 19, '#24242c');
  set(g, 56, 98, 17, 5, '#24242c');
  circle(g, 64, 100, 1.5, '#141419');

  return g;
}

function backPlateGrid() {
  const g = blank();
  fillProfile(g, baseProfile, P.redMid);
  bevelProfile(g, baseProfile);
  roundRect(g, 20, 42, 56, 32, 3, P.redShade);
  roundRect(g, 20, 88, 56, 12, 3, P.redShade);
  return g;
}

function lidOuterGrid() {
  const g = blank();
  fillProfile(g, lidOuterProfile, P.red);
  bevelProfile(g, lidOuterProfile);
  for (let j = 0; j < GRID_R; j++) {
    const b = lidOuterProfile(j);
    if (!b) continue;
    set(g, b[0] + 1, j, 2, 1, P.redShade);
  }
  for (let j = 0; j < GRID_R; j++) {
    const b = lidOuterProfile(j);
    if (!b) continue;
    set(g, b[1] - 5, j, 1, 1, P.redLight);
    set(g, b[1] - 4, j, 2, 1, P.red);
  }
  [40, 106].forEach(function(rr) {
    const b = lidOuterProfile(rr);
    if (b) set(g, b[1] - 5, rr, 6, 1, P.redShade);
  });

  const tri = [1,2,3,4,5,4,3,2,1];
  for (let k = 0; k < tri.length; k++) set(g, 15, 72 + k, tri[k], 1, P.gold);
  set(g, 32, 106, 32, 2, P.redDark);
  return g;
}

function lidInnerDesign() {
  const g = blank();
  fillProfile(g, lidInnerProfile, P.red);
  bevelProfile(g, lidInnerProfile);

  set(g, 16, 40, 60, 24, P.outline);
  set(g, 18, 42, 56, 20, P.screen);
  set(g, 18, 42, 56, 1, '#26262c');

  set(g, 16, 71, 61, 15, P.outline);
  for (let r = 0; r < 2; r++)
    for (let c = 0; c < 5; c++) {
      const x = 17 + c*12, y = 72 + r*7;
      set(g, x, y, 11, 6, P.blueMid);
      set(g, x, y, 11, 4, P.blue);
      set(g, x, y, 11, 1, '#7fc8f0');
    }

  set(g, 54, 87, 8, 2, P.outline);
  set(g, 64, 87, 8, 2, P.outline);

  set(g, 16, 91, 23, 10, P.outline);
  set(g, 17, 92, 10, 8, P.chrome);
  set(g, 28, 92, 10, 8, P.chrome);

  circle(g, 67, 95, 3.5, P.outline);
  circle(g, 67, 95, 2.6, P.yellowDark);
  circle(g, 67, 95, 1.8, P.yellow);
  circle(g, 66.2, 94.2, 0.8, '#ffe89a');

  set(g, 16, 106, 29, 11, P.outline);
  set(g, 17, 107, 27, 9, P.darkPad);
  set(g, 47, 106, 29, 11, P.outline);
  set(g, 48, 107, 27, 9, P.darkPad);

  return g;
}

const baseG = baseGrid();
const backG = backPlateGrid();
const lidOutG = lidOuterGrid();
const lidInG = lidInnerDesign();

function drawAtResolution(ctx, grid, Nc) {
  Nc = Math.max(4, Math.round(Nc));
  const Nr = Math.max(4, Math.round(Nc * GRID_R / GRID_C));
  const bw = W / Nc, bh = H / Nr;
  ctx.clearRect(0, 0, W, H);
  for (let j = 0; j < Nr; j++) {
    const sy = Math.min(GRID_R - 1, Math.floor(j * GRID_R / Nr));
    for (let i = 0; i < Nc; i++) {
      const sx = Math.min(GRID_C - 1, Math.floor(i * GRID_C / Nc));
      const c = grid[sy][sx];
      if (!c) continue;
      ctx.fillStyle = c;
      ctx.fillRect(i * bw, j * bh, bw + 0.6, bh + 0.6);
    }
  }
}

const BASE_SCREEN = {x: 24*BLOCK, y: 46*BLOCK, w: 42*BLOCK, h: 27*BLOCK};
const LID_SCREEN  = {x: 18*BLOCK, y: 42*BLOCK, w: 56*BLOCK, h: 20*BLOCK};
const LEDS = [
  {cx: 39*BLOCK, cy: 11*BLOCK, c: '#ff7a63'},
  {cx: 45*BLOCK, cy: 11*BLOCK, c: '#ffe08a'},
  {cx: 51*BLOCK, cy: 11*BLOCK, c: '#a6f090'}
];

function renderBase(N, screenW, ledGlows) {
  drawAtResolution(baseCtx, baseG, N);
  if (ledGlows) {
    LEDS.forEach(function(L, i) {
      const gl = ledGlows[i] || 0;
      if (gl <= 0) return;
      baseCtx.globalAlpha = Math.min(1, gl);
      baseCtx.fillStyle = L.c;
      baseCtx.beginPath();
      baseCtx.arc(L.cx, L.cy, 2.2 * BLOCK, 0, Math.PI * 2);
      baseCtx.fill();
      baseCtx.globalAlpha = 1;
    });
  }
  if (screenW > 0) {
    baseCtx.globalAlpha = Math.min(1, screenW);
    baseCtx.fillStyle = '#ffffff';
    baseCtx.fillRect(BASE_SCREEN.x, BASE_SCREEN.y, BASE_SCREEN.w, BASE_SCREEN.h);
    baseCtx.globalAlpha = 1;
  }
}

function renderLidInner(N, screenW) {
  drawAtResolution(lidInCtx, lidInG, N);
  if (screenW > 0) {
    lidInCtx.globalAlpha = Math.min(1, screenW);
    lidInCtx.fillStyle = '#ffffff';
    lidInCtx.fillRect(LID_SCREEN.x, LID_SCREEN.y, LID_SCREEN.w, LID_SCREEN.h);
    lidInCtx.globalAlpha = 1;
  }
}

function makeEdge(parent, side, x0, y0, x1, y1, depth, color) {
  const d = document.createElement('div');
  let css = 'position:absolute;background:' + color + ';backface-visibility:hidden;';
  if (side === 'left')
    css += `top:${y0}px;left:0;width:${depth}px;height:${y1-y0}px;transform-origin:100% 50%;transform:translateX(${x0-depth}px) rotateY(-90deg);`;
  else if (side === 'right')
    css += `top:${y0}px;left:0;width:${depth}px;height:${y1-y0}px;transform-origin:0% 50%;transform:translateX(${x1}px) rotateY(90deg);`;
  else if (side === 'bottom')
    css += `top:0;left:${x0}px;width:${x1-x0}px;height:${depth}px;transform-origin:50% 0%;transform:translateY(${y1}px) rotateX(-90deg);`;
  d.style.cssText = css;
  parent.appendChild(d);
}

const DEPTH = 34;
const BX0 = LEFT*BLOCK, BX1 = (RIGHT+1)*BLOCK, BY1 = (BOT+1)*BLOCK;

const hingeParts = [];
function setHinge(v) { hingeParts.forEach(function(d) { d.style.visibility = v; }); }

function buildSolids() {
  makeEdge(rig, 'left',   BX0, 10*BLOCK, BX1, BY1-10, DEPTH, '#8f2018');
  makeEdge(rig, 'right',  BX0, 10*BLOCK, BX1, BY1-10, DEPTH, '#5c150f');
  makeEdge(rig, 'bottom', BX0+10, 0, BX1-10, BY1, DEPTH, '#4a1009');

  makeEdge(lidHinge, 'left',   BX0, 36*BLOCK, BX1, BY1-10, DEPTH, '#8f2018');
  makeEdge(lidHinge, 'right',  BX0, 24*BLOCK, BX1, BY1-10, DEPTH, '#5c150f');
  makeEdge(lidHinge, 'bottom', BX0+10, 0, BX1-10, BY1, DEPTH, '#4a1009');

  const n = 20, r = 25;
  const w = 2 * r * Math.sin(Math.PI / n);
  const ap = r * Math.cos(Math.PI / n);
  const hTop = 22 * BLOCK, hLen = BY1 - hTop;
  const hCx = BX1 - r + 2;
  const zOff = 12;
  const L1 = 40, L2 = 45;
  for (let i = 0; i < n; i++) {
    const ang = i * (360 / n);
    const lit = Math.max(0, Math.cos((ang + 35) * Math.PI / 180));
    const f = 0.16 + 0.84 * lit;
    const col = `rgb(${Math.round(224*f)},${Math.round(80*f)},${Math.round(58*f)})`;
    const dk = `rgb(${Math.round(224*f*0.32)},${Math.round(80*f*0.32)},${Math.round(58*f*0.32)})`;
    const bg = `linear-gradient(to bottom, ${col} 0px, ${col} ${L1}px, ${dk} ${L1}px, ${dk} ${L2}px,`
      + ` ${col} ${L2}px, ${col} ${hLen-L2}px, ${dk} ${hLen-L2}px, ${dk} ${hLen-L1}px, ${col} ${hLen-L1}px)`;
    const d = document.createElement('div');
    d.style.cssText = `position:absolute;top:${hTop}px;left:0;width:${w+0.8}px;height:${hLen}px;`
      + `background:${bg};transform-origin:50% 50%;`
      + `transform:translateX(${hCx - w/2}px) translateZ(${-zOff}px) rotateY(${ang}deg) translateZ(${ap}px);`;
    rig.appendChild(d);
    hingeParts.push(d);
  }

  [[hTop, '#7d1f16', 90], [hTop + hLen, '#280705', -90]].forEach(function(capDef) {
    const cap = document.createElement('div');
    cap.style.cssText = `position:absolute;top:0;left:0;width:${2*r}px;height:${2*r}px;`
      + `border-radius:50%;background:${capDef[1]};transform-origin:50% 50%;`
      + `transform:translateX(${hCx - r}px) translateY(${capDef[0] - r}px)`
      + ` translateZ(${-zOff}px) rotateX(${capDef[2]}deg);`;
    rig.appendChild(cap);
    hingeParts.push(cap);
  });
}
buildSolids();

function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }

const IDLE_SCALE = 0.5;
const FINAL_SCALE = 0.74;
const SPIN_MS = 1300, SETTLE_MS = 280, OPEN_MS = 800;
const SCREEN_ON_MS = 560, FLASH_MS = 1250;
const OPEN_ANGLE = 150;
const SHIFT = -152;

function rigT(s, extraY, shiftX) {
  return `translateX(${shiftX}px) scale3d(${s},${s},${s}) rotateX(8deg) rotateY(${12 + extraY}deg)`;
}

let idleActive = false, idleRAF = null, idleStart = null;
let nextShakeAt = 700 + Math.random() * 900, shaking = false;

function idleFrame(ts) {
  if (!idleActive) return;
  if (!idleStart) idleStart = ts;
  const e = ts - idleStart;
  let bobY = Math.sin(e / 480) * 6;
  let swayX = Math.sin(e / 700 + 0.6) * 4;
  let rotZ = Math.sin(e / 620) * 1.5;
  if (e >= nextShakeAt && e < nextShakeAt + 500) {
    const p = (e - nextShakeAt) / 500;
    const env = Math.sin(p * Math.PI);
    bobY += -Math.sin(p * Math.PI) * 10;
    swayX += Math.sin(p * 16) * 3.5 * env;
    rotZ += Math.sin(p * 14) * 2.5 * env;
    shaking = true;
  } else if (shaking) {
    shaking = false;
    nextShakeAt = e + 1100 + Math.random() * 1200;
  }
  rigWrap.style.transform = `translate(${swayX}px, ${bobY}px) rotate(${rotZ}deg)`;
  idleRAF = requestAnimationFrame(idleFrame);
}

function startIdle() {
  idleActive = true; idleStart = null;
  nextShakeAt = 700 + Math.random() * 900; shaking = false;
  lidInnerEl.style.visibility = 'hidden';
  setHinge('hidden');
  renderBase(GRID_C, 0, null);
  drawAtResolution(backCtx, backG, GRID_C);
  drawAtResolution(lidOutCtx, lidOutG, GRID_C);
  renderLidInner(GRID_C, 0);
  rig.style.transform = rigT(IDLE_SCALE, 0, 0);
  lidHinge.style.transform = 'rotateY(0deg)';
  idleRAF = requestAnimationFrame(idleFrame);
}
function stopIdle() {
  idleActive = false;
  if (idleRAF) cancelAnimationFrame(idleRAF);
  rigWrap.style.transform = 'none';
}

let spinStart = null;
function animateSpin(ts) {
  if (!spinStart) spinStart = ts;
  const t = Math.min((ts - spinStart) / SPIN_MS, 1);
  const e = easeOutCubic(t);
  const N = 8 + e * (GRID_C - 8);
  const s = IDLE_SCALE + e * (FINAL_SCALE - IDLE_SCALE);
  rig.style.transform = rigT(s, (1 - e) * 1.2 * 360, e * SHIFT);
  renderBase(N, 0, null);
  drawAtResolution(backCtx, backG, N);
  drawAtResolution(lidOutCtx, lidOutG, N);
  if (t < 1) requestAnimationFrame(animateSpin);
  else {
    renderBase(GRID_C, 0, null);
    drawAtResolution(backCtx, backG, GRID_C);
    drawAtResolution(lidOutCtx, lidOutG, GRID_C);
    renderLidInner(GRID_C, 0);
    rig.style.transition = `transform ${SETTLE_MS}ms ease-out`;
    rig.style.transform = rigT(FINAL_SCALE, 0, SHIFT);
    setTimeout(startFlip, SETTLE_MS + 150);
  }
}

let flipStart = null;
function animateFlip(ts) {
  if (!flipStart) flipStart = ts;
  const t = Math.min((ts - flipStart) / OPEN_MS, 1);
  lidHinge.style.transform = `rotateY(${OPEN_ANGLE * easeOutCubic(t)}deg)`;
  if (t < 1) requestAnimationFrame(animateFlip);
  else setTimeout(startScreenOn, 100);
}
function startFlip() {
  flipStart = null;
  lidInnerEl.style.visibility = 'visible';
  setHinge('visible');
  lidHinge.style.transition = 'none';
  requestAnimationFrame(animateFlip);
}

let screenOnStart = null;
function animateScreenOn(ts) {
  if (!screenOnStart) screenOnStart = ts;
  const t = Math.min((ts - screenOnStart) / SCREEN_ON_MS, 1);
  const glows = [0, 1, 2].map(function(i) {
    const st = 0.04 + i * 0.17, du = 0.26;
    const q = (t - st) / du;
    return (q < 0 || q > 1) ? 0 : Math.sin(q * Math.PI);
  });
  const screenW = Math.max(0, Math.min(1, (t - 0.04) / 0.80));
  renderBase(GRID_C, screenW, glows);
  renderLidInner(GRID_C, screenW);
  if (t < 1) requestAnimationFrame(animateScreenOn);
  else startFlash();
}
function startScreenOn() {
  screenOnStart = null;
  requestAnimationFrame(animateScreenOn);
}

function sizeFullFlash() {
  fullFlash.width = window.innerWidth;
  fullFlash.height = window.innerHeight;
}

const RAY_DIRS = [-82, -54, -28, -6, 18, 44, 74, 106, 139, 168, -158, -122]
  .map(function(deg, n) {
    const a = deg * Math.PI / 180;
    return [Math.cos(a), Math.sin(a), 0.82 + 0.18 * ((n * 5) % 7) / 6];
  });

let flashStart = null, flashOx = 0, flashOy = 0, flashMaxR = 1, flashR0 = 0;
function animateFlash(ts) {
  if (!flashStart) flashStart = ts;
  const t = Math.min((ts - flashStart) / FLASH_MS, 1);
  const FW = fullFlash.width, FH = fullFlash.height;
  const block = 20;
  const c = Math.ceil(FW / block), r = Math.ceil(FH / block);
  const core   = flashR0 * 0.35 + Math.pow(t, 3.2) * flashMaxR * 2.0;
  const rayLen = flashR0 * 0.35 + t * flashMaxR * 2.4;
  const spread = 0.030 + 0.55 * Math.pow(t, 3.6);
  const W0 = block * 0.45;
  flashCtx.clearRect(0, 0, FW, FH);
  flashCtx.fillStyle = '#ffffff';
  for (let j = 0; j < r; j++)
    for (let i = 0; i < c; i++) {
      const cx = i * block + block / 2, cy = j * block + block / 2;
      const dx = cx - flashOx, dy = cy - flashOy;
      const d = Math.sqrt(dx * dx + dy * dy);
      const jit = (((i * 13 + j * 7) % 5) - 2) * block * 0.15;
      if (d + jit <= core) { flashCtx.fillRect(i * block, j * block, block, block); continue; }
      for (let n = 0; n < RAY_DIRS.length; n++) {
        const R = RAY_DIRS[n];
        const pAlong = dx * R[0] + dy * R[1];
        if (pAlong <= 0) continue;
        const qPerp = Math.abs(-dx * R[1] + dy * R[0]);
        if (qPerp <= W0 + pAlong * spread && pAlong + jit <= rayLen * R[2]) {
          flashCtx.fillRect(i * block, j * block, block, block);
          break;
        }
      }
    }
  if (t < 1) requestAnimationFrame(animateFlash);
  else handoff();
}
function startFlash() {
  sizeFullFlash();
  const rect = document.getElementById('base').getBoundingClientRect();
  flashOx = rect.left + rect.width * 0.469;
  flashOy = rect.top + rect.height * 0.472;
  flashR0 = Math.max(rect.width, rect.height) * 0.12;
  const FW = fullFlash.width, FH = fullFlash.height;
  flashMaxR = Math.max(
    Math.sqrt(flashOx*flashOx + flashOy*flashOy),
    Math.sqrt((FW-flashOx)*(FW-flashOx) + flashOy*flashOy),
    Math.sqrt(flashOx*flashOx + (FH-flashOy)*(FH-flashOy)),
    Math.sqrt((FW-flashOx)*(FW-flashOx) + (FH-flashOy)*(FH-flashOy))
  );
  fullFlash.style.opacity = 1;
  flashStart = null;
  requestAnimationFrame(animateFlash);
}

/* ----------------------------------------------------------------- handoff
   The frame is solid white here, so the swap is invisible: drop the landing
   scene, start the UI sliding up underneath, then dissolve the white away. */
const FADE_DELAY = 140, FADE_MS = 700;
function handoff() {
  flashCtx.fillRect(0, 0, fullFlash.width, fullFlash.height);
  stopIdle();
  landingEl.classList.add('gone');
  window.PORTFOLIO.enterUI();
  setTimeout(function () {
    fullFlash.style.transition = `opacity ${FADE_MS}ms ease`;
    fullFlash.style.opacity = 0;
  }, FADE_DELAY);
  setTimeout(function () {
    replayBtn.classList.add('visible');
  }, FADE_DELAY + FADE_MS + 200);
}

function launchSequence() {
  stopIdle();
  rigWrap.style.transform = 'none';
  titleWrap.style.transition = 'opacity 300ms ease';
  titleWrap.style.opacity = 0;
  rigWrap.style.pointerEvents = 'none';
  spinStart = flipStart = screenOnStart = flashStart = null;
  rig.style.transition = 'none';
  lidHinge.style.transform = 'rotateY(0deg)';
  requestAnimationFrame(animateSpin);
}

function resetAll() {
  replayBtn.classList.remove('visible');
  window.PORTFOLIO.resetUI();
  landingEl.classList.remove('gone');
  fullFlash.style.transition = 'none';
  fullFlash.style.opacity = 0;
  flashCtx.clearRect(0, 0, fullFlash.width, fullFlash.height);
  titleWrap.style.transition = 'none';
  titleWrap.style.opacity = 1;
  rigWrap.style.pointerEvents = 'auto';
  rig.style.transition = 'none';
  lidHinge.style.transition = 'none';
  startIdle();
}

rigWrap.addEventListener('click', launchSequence);
replayBtn.addEventListener('click', resetAll);
window.addEventListener('resize', sizeFullFlash);

sizeFullFlash();
resetAll();

})();
</script>

      inset 0 0 0 1px rgba(0,0,0,0.28),

      inset 0 -4px 6px rgba(0,0,0,0.28),
      0 var(--lift, 7px) 0 var(--side),

const esc = s => String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
const pad3 = n => String(n).padStart(3, '0');

let cur = { r: 0, c: 0 };
const at = () => GRID[cur.r][cur.c];

    h += '<ul class="bul">' + b.bullets.map(l => '<li>' + esc(l) + '</li>').join('') + '</ul></div>';
  });

  [...keypad.children].forEach(function (b) {

    b.setAttribute('aria-current', String(b.dataset.label === here));
  });

function paint() { renderMain(); renderSide(); renderCounter(); markKeys(); }

// ------------------------------------------------------------------ actions
function cursorTo(label) {
  for (let r = 0; r < GRID.length; r++) {
    const c = GRID[r].indexOf(label);
    if (c >= 0) { cur = { r: r, c: c }; break; }
  }
  if (SECTIONS[label]) active = label;
  paint();
}

function moveCursor(dr, dc) {
  cur.r = (cur.r + dr + GRID.length) % GRID.length;
  cur.c = (cur.c + dc + GRID[0].length) % GRID[0].length;
  if (SECTIONS[at()]) active = at();
  paint();
}

// Red / Enter: act on whatever the cursor is sitting on. A link only opens on
// an explicit press — never just because the cursor drifted over it.
function activate() {
  const label = at();
  const el = keypad.querySelector('[data-label="' + label + '"]');
  if (el) fire(el);
  if (LINKS[label]) window.open(LINKS[label], /^https?:/.test(LINKS[label]) ? '_blank' : '_self');
  else { active = label; paint(); }
}

const scrollPage = f => main.scrollBy({ top: main.clientHeight * f, behavior: 'smooth' });
const toggleLit  = () => glass.classList.toggle('lit');

function fire(el) {
  if (!el) return;
  el.classList.remove('fired');
  void el.offsetWidth;
  el.classList.add('fired');
  setTimeout(() => el.classList.remove('fired'), 340);
}
function press(el) {
  if (!el) return;
  el.classList.add('press');
  setTimeout(() => el.classList.remove('press'), 150);
}

// The cross is one piece: tipping it is a class on the plate, not four caps.
let tipTimer = null;
function tip(dir) {
  clearTimeout(tipTimer);
  plate.classList.remove('up', 'down', 'left', 'right');
  void plate.offsetWidth;
  plate.classList.add(dir);
  tipTimer = setTimeout(() => plate.classList.remove(dir), 170);
}

const DIR = {
  up:    () => moveCursor(-1, 0),
  down:  () => moveCursor(1, 0),
  left:  () => moveCursor(0, -1),
  right: () => moveCursor(0, 1)
};

  open:     activate,
  home:     () => cursorTo('HOME'),
  next:     () => cursorTo(ORDER[(ORDER.indexOf(active) + 1) % ORDER.length]),

    el.type = 'button';
    el.addEventListener('click', function () { cursorTo(label); fire(el); });
  }
  keypad.appendChild(el);
});

TILES.forEach(function (t) {
  const a = document.createElement('a');
  a.className = 'tile';
  a.href = t.href; a.target = '_blank'; a.rel = 'noopener';
  a.innerHTML = '<span class="tag">' + esc(t.tag) + '</span>' +
                '<span class="name">' + esc(t.name) + '</span>';
  tileBox.appendChild(a);
});

document.querySelectorAll('.dpad .dz').forEach(function (z) {
  z.addEventListener('click', function () { tip(z.dataset.dir); DIR[z.dataset.dir](); });
});
document.querySelectorAll('[data-act]').forEach(function (b) {
  b.addEventListener('click', function () { ACTS[b.dataset.act](); fire(b); });
});

// ------------------------------------------------------------------ layout
const W = 1196, H = 880, CROP = 152, GAP = 14;
let restY = 0, startY = 0, revealed = false;

function layout() {
  const vw = window.innerWidth, vh = window.innerHeight;
  const k = Math.min(vw * 0.97 / W, vh / (H - CROP), 1.55);
  stage.style.setProperty('--k', k);
  const devH = H * k;
  restY = devH + GAP <= vh ? (vh - devH) / 2 : vh - devH - GAP;
  startY = vh + 30;
  stage.dataset.k = k;
  apply(revealed ? restY : startY, k);
}
function apply(y, k) {
  stage.style.transform = 'translateX(-50%) translateY(' + y + 'px) scale(' + k + ')';
}
window.addEventListener('resize', layout);

// --------------------------------------------------------- slide + handoff
const SLIDE_MS = 950;
const easeOutCubic = t => 1 - Math.pow(1 - t, 3);
let slideStart = null;

function slide(ts) {
  if (!slideStart) slideStart = ts;
  const t = Math.min((ts - slideStart) / SLIDE_MS, 1);
  apply(startY + (restY - startY) * easeOutCubic(t), +stage.dataset.k);
  if (t < 1) requestAnimationFrame(slide);
}

window.PORTFOLIO.enterUI = function () {
  revealed = true;
  uiLayer.classList.add('on');
  layout();
  apply(startY, +stage.dataset.k);
  slideStart = null;
  requestAnimationFrame(slide);
};
window.PORTFOLIO.resetUI = function () {
  revealed = false;
  uiLayer.classList.remove('on');
  layout();
};

// ---------------------------------------------------------------- keyboard
const KEYMAP = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right' };
document.addEventListener('keydown', function (ev) {
  if (!revealed) return;
  if (ev.target && /^(INPUT|TEXTAREA)$/.test(ev.target.tagName)) return;
  const dir = KEYMAP[ev.key];
  if (dir) { ev.preventDefault(); tip(dir); DIR[dir](); return; }
  const hit = {
    Enter: 'open', Backspace: 'home', PageUp: 'pageup', PageDown: 'pagedown'
  }[ev.key];
  if (!hit) return;
  ev.preventDefault();
  const b = document.querySelector('[data-act="' + hit + '"]');
  press(b); ACTS[hit]();
});

paint();
layout();

})();
</script>
</body>
